<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2340e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IELTS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>IELTS трекер</title>
<style>
/* VOICE: calm, native-feeling study planner. IDEA: exam ticket stub over a weekly study log.
   PICTURE: blue band with the countdown and today's ring, then the day's checklist.
   COLOUR+TYPE: ballpoint blue, white sheets, one colour per IELTS section; SF system text, rounded figures.
   LAYOUT: iPhone — stacked with a bottom tab bar; Mac — sidebar and content up to 1100px. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f1ee,#0e0e11);--panel:light-dark(#fff,#1b1b1f);--panel2:light-dark(#f6f5f2,#26262b);
--ink:light-dark(#151518,#f2f2f4);--mute:light-dark(#66666e,#a1a1aa);--line:light-dark(#e3e1dc,#313137);
--blue:light-dark(#2340e0,#6f86ff);--btn:light-dark(#2340e0,#3d58f0);--hero:light-dark(#2340e0,#1a2a94);--bsoft:light-dark(#e8ecff,#1e2652);
--hl:#ffe14d;--red:light-dark(#cf2a1e,#ff6a5f);--green:light-dark(#168048,#3ccf7f);--seg:light-dark(#fff,#3a3a41);
--r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html.modal body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--blue)}svg{flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 65%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.app{min-height:100vh;min-height:100dvh}
/* nav: tab bar on iPhone, sidebar on Mac */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:4px max(6px,var(--sal)) calc(4px + var(--sab)) max(6px,var(--sar));background:var(--panel);border-top:1px solid var(--line)}
.nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:var(--panel)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600;border-radius:12px}
.nav a svg{width:25px;height:25px}.nav a[aria-current=page]{color:var(--blue)}
.brand,.navfoot{display:none}
main{padding-bottom:calc(84px + var(--sab))}
.pg{max-width:1100px;margin:0 auto;padding:0 max(16px,var(--sar)) 8px max(16px,var(--sal))}
@media(max-width:899px){html{background:var(--panel)}}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:220px minmax(0,1fr)}
 .nav{position:sticky;top:0;height:100vh;flex-direction:column;gap:2px;padding:22px 12px;border:0;border-right:1px solid var(--line);background:var(--panel2)}
 .nav::after{display:none}
 .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:42px;padding:0 12px;font-size:15px;color:var(--ink)}
 .nav a svg{width:21px;height:21px;color:var(--blue)}.nav a[aria-current=page]{background:var(--bsoft);color:var(--blue)}
 .brand{display:block;padding:0 12px 18px}.brand b{display:block;font-size:22px}.brand span{color:var(--mute);font-size:14px}
 .navfoot{display:block;margin-top:auto;padding:0 12px;font-size:13px;color:var(--mute)}
 main{padding-bottom:40px}.pg{padding:0 32px 8px}
}
/* hero */
.hero{background:var(--hero);color:#fff;padding:calc(var(--sat) + 22px) max(20px,var(--sar)) 24px max(20px,var(--sal))}
.hero-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center}
@media(min-width:900px){.hero{padding:30px 32px}}
.hmeta{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:rgba(255,255,255,.86)}
.hmeta .ibtn{color:#fff;margin:-10px 0}
.count{font-size:clamp(72px,21vw,120px);font-weight:700;line-height:.92;letter-spacing:-.04em;margin-top:6px}
.cl{font-size:18px;font-weight:600;margin-top:4px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tchip{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:600}
.hring{display:grid;justify-items:center;gap:6px;text-align:center}
.ringbox{position:relative;width:120px;height:120px}.ringbox svg{width:100%;height:100%}
.rb{fill:none;stroke:rgba(255,255,255,.22);stroke-width:11}.rf{fill:none;stroke:var(--hl);stroke-width:11;stroke-linecap:round}
.rc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1}
.rc b{font-size:32px;font-weight:700}.rc small{font-size:17px;opacity:.7}.rc span{font-size:13px;opacity:.8;margin-top:4px}
.rcap{font-size:14px;color:rgba(255,255,255,.88);font-weight:600}
@media(max-width:520px){.ringbox{width:100px;height:100px}.rc b{font-size:26px}}
/* controls */
.btn{appearance:none;border:1px solid transparent;border-radius:12px;min-height:44px;padding:0 16px;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--panel2);color:var(--ink);white-space:nowrap}
.btn svg{width:18px;height:18px}.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn.pri{background:var(--btn);color:#fff}.btn.white{background:#fff;color:#1a2fb0}
.btn.line{background:transparent;border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.btn.ghost{background:transparent;color:var(--blue);padding:0 8px}.btn.danger{color:var(--red)}.btn.dbg{background:var(--red);color:#fff}
.ibtn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;background:transparent;border:0;color:inherit;text-decoration:none}
.ibtn svg{width:21px;height:21px}.ibtn.go{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;min-height:40px;padding:0 14px;font-size:15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--btn);border-color:transparent;color:#fff}
.chip:disabled{opacity:.35;cursor:default}
.wd .chip{min-width:44px;padding:0 10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;flex:none}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:11px;padding:2px;gap:2px}
.seg button{border:0;background:none;font-size:14px;font-weight:650;min-height:36px;padding:0 14px;border-radius:9px}
.seg button[aria-pressed=true]{background:var(--seg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* layout bits */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.sec h2{font-size:21px;font-weight:750;margin:0}
.ptitle{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0;padding:calc(var(--sat) + 22px) 0 6px;line-height:1.1}
@media(min-width:900px){.ptitle{padding-top:34px}}
.lead{color:var(--mute);margin:4px 0 14px}.fine{color:var(--mute);font-size:13px;margin:8px 0 0}
.empty{color:var(--mute);background:var(--panel);border-radius:var(--r);padding:16px;margin:0}
.card{background:var(--panel);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ch{font-size:15px;font-weight:700;margin:0 0 10px}
.cols{display:grid;gap:0 24px}
@media(min-width:1000px){.cols{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);align-items:start}}
/* today sections */
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.sc{background:var(--panel);border-radius:14px;padding:10px 10px 12px;display:grid;gap:4px}
@media(max-width:560px){.secs{grid-template-columns:repeat(2,minmax(0,1fr))}.sc{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;padding:10px 12px}.sc .mini{grid-column:1/-1}.sc b{font-size:19px}}
.sc .n{font-size:13px;font-weight:650;color:var(--mute);display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.sc b{font-size:22px;font-weight:700;line-height:1}.sc b.ok{color:var(--green)}.sc b.np{font-size:15px;color:var(--mute);font-weight:600}
.mini{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}.mini i{display:block;height:100%;background:var(--c)}
/* list */
.list{background:var(--panel);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 4px;min-height:60px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.check{width:44px;height:44px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0}
.check i{width:27px;height:27px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mute) 65%,transparent);display:grid;place-items:center;color:transparent}
.check i svg{width:16px;height:16px;stroke-width:3}
.row.done .check i{background:var(--green);border-color:var(--green);color:#fff}
.gap{width:12px;flex:none}
.body{flex:1;display:grid;gap:2px;padding:8px 6px;text-align:left;background:none;border:0;min-height:44px;align-content:center}
.t{font-weight:650;display:flex;align-items:center;line-height:1.25}
.row.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mute) 60%,transparent)}
.meta{color:var(--mute);font-size:14px}
.kind{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin:0 4px 0 8px;background:var(--panel2);color:var(--mute)}
.kind.learn{background:var(--bsoft);color:var(--blue)}
.addrow{margin-top:6px}
.allok{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-weight:650}
.allok i{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}.allok svg{width:20px;height:20px;stroke-width:3}
/* week */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{border:0;background:var(--panel);border-radius:12px;min-height:58px;display:grid;place-content:center;gap:2px;font-weight:650}
.days button span{font-size:13px;color:var(--mute);font-weight:600}
.days button[aria-pressed=true]{background:var(--btn);color:#fff}.days button[aria-pressed=true] span{color:rgba(255,255,255,.8)}
.tbl{display:grid;gap:0}
.tr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;align-items:center;min-height:44px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.tr:first-child{border-top:0}
.tr .nm{display:flex;align-items:center}.tr .v{color:var(--mute)}
/* progress */
.calhead{display:flex;align-items:center;justify-content:space-between}.calhead h2{font-size:20px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdh{text-align:center;font-size:13px;color:var(--mute);font-weight:650;padding-bottom:4px}
.cal .d{border:0;background:none;border-radius:12px;display:grid;justify-items:center;padding:4px 0;min-height:48px}
.ring{width:36px;height:36px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center}
.ring b{width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:14px;font-weight:650}
.cal .full .ring{background:var(--green)}.cal .none .ring{background:transparent}.cal .fut .ring b{color:var(--mute)}
.cal .tod .ring b{background:var(--btn);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin-top:10px}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border-radius:var(--r);padding:14px;display:grid;gap:2px;align-content:start}
.kpi b{font-size:30px;font-weight:700;line-height:1.05}.kpi b small{font-size:17px;color:var(--mute)}.kpi span{font-size:13px;color:var(--mute)}
.sgrid{display:grid;gap:10px}@media(min-width:700px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{background:var(--panel);border-radius:var(--r);padding:14px 16px}
.scard h3{margin:0;font-size:17px;display:flex;align-items:center}.scard h3 b{margin-left:auto;font-size:24px}
.scard .bar{height:8px;border-radius:4px;background:var(--panel2);margin:10px 0 8px;overflow:hidden}.scard .bar i{display:block;height:100%;background:var(--c)}
.scard p{margin:0;font-size:14px;color:var(--mute)}
/* settings */
.gh{font-size:13px;font-weight:650;color:var(--mute);margin:24px 16px 6px}
.group{background:var(--panel);border-radius:var(--r);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 12px 6px 16px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;font-size:16px;color:var(--ink);text-decoration:none}
.it:first-child{border-top:0}.itx{flex:1;display:grid;gap:1px;line-height:1.3}.itx b{font-weight:600}.sub{color:var(--mute);font-size:14px}
.it.chev::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);margin-right:6px;opacity:.6;flex:none}
.it.add{color:var(--blue);font-weight:600}.it.add svg{width:20px;height:20px}.it.danger{color:var(--red)}
.pg.narrow{max-width:720px}
/* sheet */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.sheet{position:relative;width:100%;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,var(--sar)) calc(24px + var(--sab)) max(16px,var(--sal));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin:8px auto 0}
@media(min-width:700px){.layer{align-items:center}.sheet{width:min(560px,92vw);border-radius:20px;max-height:86vh;padding:0 22px 22px}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 0}
.sh-head h2{flex:1;font-size:19px;margin:0}
.field{display:grid;gap:6px;margin:14px 0}.field>span{font-size:13px;font-weight:650;color:var(--mute)}
input,select{font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 12px;width:100%}
[aria-invalid=true]{border-color:var(--red)}.err{color:var(--red);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:flex-end}
.box{background:var(--panel);border-radius:14px;padding:12px 14px;margin-top:10px;display:grid;gap:4px}
.obs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--panel);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:15px}.obs span{color:var(--mute)}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 24px);bottom:calc(76px + var(--sab));z-index:70;background:light-dark(#1d1d21,#3a3a42);color:#fff;border-radius:14px;padding:4px 4px 4px 16px;display:flex;align-items:center;font-size:15px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast span{padding:10px 8px 10px 0}.toast button{background:none;border:0;color:#a9b8ff;font-weight:700;min-height:40px;padding:0 10px}
.modal .toast{bottom:calc(20px + var(--sab))}@media(min-width:900px){.toast{bottom:28px;left:220px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(hover:hover){button.body:hover .t{color:var(--blue)}.row.done button.body:hover .t{color:var(--mute)}}
</style>
</head>
<body>
<div class="app"><nav class="nav" id="nav" aria-label="Разделы"></nav><main id="view"></main></div>
<div class="layer" id="layer" hidden><div class="backdrop"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
{
'use strict';
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const plural = (n, a, b, c) => { const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? a : t >= 2 && t <= 4 && (h < 10 || h >= 20) ? b : c; };
const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MON = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'], WEEK = [1, 2, 3, 4, 5, 6, 0];
const fmtD = s => { const d = parseD(s); return `${d.getDate()} ${MON_G[d.getMonth()]}`; };
const fmtDW = s => `${WD[parseD(s).getDay()]}, ${fmtD(s)}`;
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; u = u.replace(/^http:\/\//i, 'https://'); if (!/^https:\/\//i.test(u)) u = 'https://' + u; return /^https:\/\/[^\s<>"']+$/.test(u) ? u : ''; };
const opts = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  today: svg('<circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.8 2.8 5.4-5.6"/>'),
  week: svg('<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  chart: svg('<path d="M4 20h16"/><path d="M7.5 16v-5M12 16V6M16.5 16v-8"/>'),
  prefs: svg('<path d="M4 7h8.5M18.5 7H20M4 17h2.5M12.5 17H20"/><circle cx="15.5" cy="7" r="2.6"/><circle cx="9.5" cy="17" r="2.6"/>'),

const focChips = (sec, sel) => FOC_FOR[sec]?.length ? one('foc', [['', 'Практика секции'], ...FOC_FOR[sec].map(f => [f, FOC[f]])], sel || '') : '<p class="fine" style="margin:0">Для этой секции отдельного фокуса нет.</p>';
function lessonForm(o) {
  return `<label class="field"><span>Источник</span><select name="src" data-c="src">${opts(srcs().map(s => [s.id, `${s.name} — ${KIND[s.kind]}`]), o.src)}</select></label>
    <div class="field"><span>Секция</span><div id="secBox">${secChips(o.src, o.sec)}</div></div>
    <div class="field"><span>Фокус</span><div id="focBox">${focChips(o.sec, o.foc)}</div></div>
    <label class="field"><span>Заметка — необязательно</span><input name="note" value="${esc(o.note || '')}" maxlength="80" placeholder="Например: Cambridge 18, Test 2"></label>`;
}
function readLesson() {
  const o = { src: val('src'), sec: pressed('sec')[0] || '', foc: pressed('foc')[0] || '', note: val('note') };
  if (!o.src) { toast('Сначала добавь источник'); return null; }
  if (!o.sec) { toast('Выбери секцию'); return null; }
  if (!FOC_FOR[o.sec].includes(o.foc)) o.foc = '';
  return o;
}
function shOnboard() {
  const e = S.meta.exam, st = starter();
  sheet('Настроим подготовку', `<label class="field"><span>Экзамен</span><select name="name">${opts([['IELTS Academic', 'IELTS Academic'], ['IELTS General Training', 'IELTS General Training']], e.name)}</select></label>
    <div class="two"><label class="field"><span>Дата экзамена</span><input type="date" name="date" value="${esc(e.date)}"></label><label class="field"><span>Цель</span><select name="target">${bandOpts(e.target)}</select></label></div>
    <h3 class="ch" style="margin-top:18px">Источники</h3>${st.sources.map(s => `<div class="obs"><b>${esc(s.name)}</b><span>${KIND[s.kind]}</span><span style="grid-column:1/-1">${s.secs.length === 4 ? 'Все секции' : s.secs.map(k => SEC[k].n).join(', ')}</span></div>`).join('')}
    <p class="fine">Каждый день 4 занятия: Engnovate — Reading, British Council — Writing (Grammar / Vocabulary по очереди), goprep и YouTube — Listening и Speaking через день. Расписание можно изменить во вкладке «Неделя».</p>
    <div class="box"><b>Уже пользуешься на другом устройстве?</b><span class="sub">Подключи синхронизацию — прогресс загрузится сюда.</span><div><button class="btn sm line" data-a="gSetup">Подключить синхронизацию</button></div></div>
    <div class="acts"><button class="btn pri" data-a="x" data-f="go">Создать план</button></div>`, {
    go: () => {
      Object.assign(S.meta.exam, { name: val('name'), date: val('date'), target: val('target') });
      if (!S.meta.sources.length) Object.assign(S.meta, starter());
      S.meta.on = true; commit(true); close(); toast('План на сегодня готов');
    }, onboard: true });
}
function shExam() {
  const e = S.meta.exam;
  sheet('Экзамен и цель', `<label class="field"><span>Экзамен</span><select name="name">${opts([['IELTS Academic', 'IELTS Academic'], ['IELTS General Training', 'IELTS General Training']], e.name)}</select></label>
    <div class="two"><label class="field"><span>Дата экзамена</span><input type="date" name="date" value="${esc(e.date)}"></label><label class="field"><span>Общий балл</span><select name="target">${bandOpts(e.target)}</select></label></div>
    <div class="four">${SECS.map(k => `<label class="field"><span>${SEC[k].n}</span><select name="t${k}">${bandOpts(e.t[k])}</select></label>`).join('')}</div>
    <div class="acts"><button class="btn pri" data-a="x" data-f="save">Сохранить</button></div>`, {
    save: () => { Object.assign(e, { name: val('name'), date: val('date'), target: val('target') }); for (const k of SECS) e.t[k] = val('t' + k); commit(true); close(); } });
}
function shItem(D, id) {
  const d = S.days[D] || (D === today() ? ensureDay(D) : (S.days[D] = { auto: false, u: Date.now(), items: [] }));
  const it = id ? d.items.find(x => x.id === id) : null;
  const o = it || { src: srcs()[0]?.id || '', sec: '', foc: '', note: '' };
  if (!o.sec) o.sec = src(o.src)?.secs[0] || 'L';
  sheet(it ? esc(label(it)) : 'Занятие на ' + (D === today() ? 'сегодня' : fmtD(D)), lessonForm(o) + `<p class="fine">${it ? 'Изменения касаются только этого дня.' : 'Разовое занятие — в расписание недели не попадёт.'}</p>
    <div class="acts">${it ? '<button class="btn line danger" data-a="x" data-f="del">Убрать из дня</button>' : ''}<button class="btn pri" data-a="x" data-f="save">${it ? 'Сохранить' : 'Добавить'}</button></div>`, {
    del: () => { touchItem(D, it); it.del = true; commit(); close(); toast('Убрано из дня', { l: 'Вернуть', f: () => { touchItem(D, it); it.del = false; commit(); } }); },
    save: () => {
      const v = readLesson(); if (!v) return;
      if (it) { Object.assign(it, v); touchItem(D, it); }
      else { const n = { id: 'x' + rid(), ...v, done: 0, del: false, o: 100 + d.items.length, u: 0 }; d.items.push(n); touchItem(D, n); }
      commit(); close();
    } });
}
function shTpl(id) {
  const t = id ? S.meta.tpl.find(x => x.id === id) : null;
  const o = t || { src: srcs()[0]?.id || '', sec: '', foc: '', note: '', days: [selWd] };
  if (!o.sec) o.sec = src(o.src)?.secs[0] || 'L';
  sheet(t ? 'Регулярное занятие' : 'Новое занятие', lessonForm(o) + `<div class="field"><span>Дни недели</span><div class="chips wd" data-g="days">${WEEK.map(d => `<button type="button" class="chip" data-a="tog" data-v="${d}" aria-pressed="${o.days.includes(d)}">${WD[d]}</button>`).join('')}</div></div>
    <p class="fine">Действует с сегодняшнего дня, если сегодня ещё ничего не отмечено, иначе — с завтрашнего. Прошлые дни не меняются.</p>
    <div class="acts">${t ? '<button class="btn line danger" data-a="x" data-f="del">Удалить</button>' : ''}<button class="btn pri" data-a="x" data-f="save">${t ? 'Сохранить' : 'Добавить'}</button></div>`, {
    del: () => { S.meta.tpl = S.meta.tpl.filter(x => x !== t); refreshAuto(today()); commit(true); close(); },
    save: () => {
      const v = readLesson(); if (!v) return;
      const days = pressed('days').map(Number); if (!days.length) { toast('Выбери хотя бы один день'); return; }
      if (t) Object.assign(t, v, { days }); else S.meta.tpl.push({ id: 'p' + rid(), o: S.meta.tpl.length, ...v, days });
      refreshAuto(today()); commit(true); close();
    } });
}
function shSrc(id) {
  const s = id ? src(id) : { name: '', url: '', kind: 'practice', secs: ['L', 'R', 'W', 'S'] };
  sheet(id ? esc(s.name) : 'Новый источник', `<label class="field"><span>Название</span><input name="name" value="${esc(s.name)}" maxlength="40"></label>
    <label class="field"><span>Ссылка</span><input name="url" type="url" inputmode="url" value="${esc(s.url)}" placeholder="https://…"></label>
    <div class="field"><span>Тип</span>${one('kind', [['practice', 'Практика'], ['learn', 'Обучение']], s.kind)}</div>
    <div class="field"><span>Секции</span><div class="chips" data-g="secs">${SECS.map(k => `<button type="button" class="chip" data-a="tog" data-v="${k}" aria-pressed="${s.secs.includes(k)}">${SEC[k].n}</button>`).join('')}</div></div>
    ${id && safeUrl(s.url) ? `<p><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Открыть сайт</a></p>` : ''}
    <div class="acts">${id ? '<button class="btn line danger" data-a="x" data-f="del">Удалить</button>' : ''}<button class="btn pri" data-a="x" data-f="save">${id ? 'Сохранить' : 'Добавить'}</button></div>`, {
    del: () => { s.arch = true; refreshAuto(today()); commit(true); close(); toast('Источник удалён, история сохранена'); },
    save: () => {
      const name = val('name'), url = val('url'), secs = pressed('secs');
      if (!name) return err('name', 'Добавь название');
      if (url && !safeUrl(url)) return err('url', 'Нужна ссылка вида https://…');
      if (!secs.length) return toast('Выбери хотя бы одну секцию');
      const v = { name, url: safeUrl(url), kind: pressed('kind')[0] || 'practice', secs };
      if (id) Object.assign(s, v); else S.meta.sources.push({ id: 's' + rid(), ...v });
      refreshAuto(today()); commit(true); close();
    } });
}
function shDay(D) {
  const st = dstat(D);
  sheet(fmtDW(D), `<p class="lead">${st.total ? `Выполнено ${st.done} из ${st.total}` : 'Занятий не было'}</p>${st.total ? `<div class="list">${st.l.map(it => row(D, it)).join('')}</div>` : ''}
    ${D <= today() ? `<div class="acts" style="justify-content:flex-start"><button class="btn line" data-a="add" data-d="${D}">${IC.plus} Добавить занятие</button></div>` : '<p class="fine">План будущего дня смотри во вкладке «Неделя».</p>'}`, { day: D });
}
function confirmSheet(title, text, ok, fn) { sheet(esc(title), `<p class="lead">${esc(text)}</p><div class="acts"><button class="btn line" data-a="close">Отмена</button><button class="btn dbg" data-a="x" data-f="ok">${esc(ok)}</button></div>`, { ok: fn }); }

// ---------- GitHub gist sync ----------
const GF = 'ielts-planner.json', OLDF = 'ielts-tracker-data.json';
let G = {}; try { G = JSON.parse(localStorage.getItem('ielts-gist') || '{}'); } catch (e) { G = {}; }
const gOn = () => !!(G.token && G.id);
let sState = 'off', busy = null, syncT = 0;
const syncText = () => !gOn() ? 'Только на этом устройстве' : { ok: 'Синхронизировано', saving: 'Синхронизация…', offline: 'Нет связи — сохраню позже', err: 'Ошибка синхронизации' }[sState] || 'Синхронизация…';
function setS(m) { sState = m; for (const el of $$('#syncL,#syncL2')) el.textContent = syncText(); }
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + G.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
function merge(R) {
  let ch = false, push = false;
  if (R.meta && (R.meta.u || 0) > (S.meta.u || 0)) { S.meta = R.meta; ch = true; } else if ((S.meta.u || 0) > (R.meta?.u || 0)) push = true;
  const Rd = R.days || {};
  for (const D of new Set([...Object.keys(S.days), ...Object.keys(Rd)])) {
    const l = S.days[D], r = Rd[D];
    if (!r) { push = true; continue; }
    if (!l) { S.days[D] = r; ch = true; continue; }
    const m = new Map(l.items.map(x => [x.id, x]));
    for (const ri of r.items) { const li = m.get(ri.id); if (!li) { l.items.push(ri); ch = true; } else if ((ri.u || 0) > (li.u || 0)) { Object.assign(li, ri); ch = true; } else if ((li.u || 0) > (ri.u || 0)) push = true; }
    for (const li of l.items) if (!r.items.some(x => x.id === li.id)) push = true;
    const auto = !!(l.auto && r.auto); if (l.auto !== auto) { l.auto = auto; ch = true; } if (r.auto !== auto) push = true;
  }
  return [ch, push];
}
async function sync(force) {
  if (!gOn()) return;
  if (busy) { busy.again = true; return; }
  busy = { again: false }; setS('saving');
  try {
    const g = await gh('/gists/' + G.id), f = g.files?.[GF];
    let R = null;
    if (f) { const txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content; try { R = JSON.parse(txt).data; } catch (e) { R = null; } }
    let ch = false, push = !!force;
    if (R) { const r = merge(R); ch = r[0]; push = push || r[1]; } else push = S.meta.on || Object.keys(S.days).length > 0;
    if (push) await gh('/gists/' + G.id, { method: 'PATCH', body: JSON.stringify({ files: { [GF]: { content: JSON.stringify({ app: 'ielts-planner', v: 2, saved: new Date().toISOString(), data: S }) } } }) });
    setS('ok');
    if (ch) { fix(); save(); if (S.meta.on && ctx.onboard) close(); render(); }
  } catch (e) {
    setS(e.status === 401 || e.status === 404 ? 'err' : 'offline');
    if (e.status === 401) toast('GitHub не принял токен — подключи синхронизацию заново');
  } finally { const again = busy.again; busy = null; if (again) syncSoon(300); }
}
function syncSoon(ms = 1200) { if (!gOn()) return; clearTimeout(syncT); syncT = setTimeout(() => sync(true), ms); }
function shGist() {
  sheet('Синхронизация iPhone ↔ Mac', `<p class="lead">Прогресс хранится в приватном gist в твоём GitHub. На обоих устройствах вводится один и тот же токен — второе устройство само найдёт данные.</p>
    <div class="box"><b>1. Создай токен</b><span class="sub">Войди в GitHub, срок — «No expiration», оставь только галочку <b>gist</b>, нажми «Generate token».</span><div><a class="btn sm line" href="https://github.com/settings/tokens/new?scopes=gist&description=IELTS%20tracker" target="_blank" rel="noopener">${IC.ext} Создать токен</a></div></div>
    <div class="box"><b>2. Вставь токен</b><span class="sub">Хранится только на этом устройстве и даёт доступ лишь к gist.</span><label class="field"><span>Токен</span><input name="tok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"></label></div>
    <div class="acts"><button class="btn pri" data-a="x" data-f="go">Подключить</button></div>`, {
    go: async el => {
      const tok = val('tok');
      if (!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(tok)) return err('tok', 'Это не похоже на токен GitHub');
      el.disabled = true; el.textContent = 'Подключаю…';
      const prev = G; G = { token: tok };
      try {
        const list = await gh('/gists?per_page=100');
        const found = list.find(g => g.files && g.files[GF]) || list.find(g => g.files && g.files[OLDF]);
        if (found) G.id = found.id;
        else G.id = (await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'IELTS planner data (private)', public: false, files: { [GF]: { content: JSON.stringify({ app: 'ielts-planner', v: 2, data: S }) } } }) })).id;
        localStorage.setItem('ielts-gist', JSON.stringify(G));
        await sync(false);
        close(); render(); toast(found ? 'Подключено' : 'Подключено — теперь подключи второе устройство');
        if (!S.meta.on) shOnboard();
      } catch (e) {
        G = prev; el.disabled = false; el.textContent = 'Подключить';
        err('tok', e.status === 401 ? 'GitHub не принял токен' : e.status === 403 || e.status === 404 ? 'У токена нет доступа к gist' : 'Нет связи с GitHub, попробуй ещё раз');
      }
    } });
}

// ---------- events ----------
const ACT = {
  close, x: (el, e) => ctx[el.dataset.f]?.(el, e),
  onboard: () => shOnboard(),
  exam: shExam,
  tick: el => {
    const D = el.dataset.d, it = S.days[D]?.items.find(x => x.id === el.dataset.id); if (!it) return;
    it.done = it.done ? 0 : Date.now(); touchItem(D, it); commit();
    if (!$('#layer').hidden && ctx.day) shDay(ctx.day);
    const st = dstat(D); if (it.done && st.full && D === today()) toast('План на сегодня выполнен!');
  },
  item: el => shItem(el.dataset.d, el.dataset.id),
  add: el => shItem(el.dataset.d, ''),
  wd: el => { selWd = +el.dataset.v; render(); },
  tpl: el => shTpl(el.dataset.id),
  src: el => shSrc(el.dataset.id),
  day: el => shDay(el.dataset.d),
  cal: el => { calM = el.dataset.v; render(); },
  period: el => { period = el.dataset.v; render(); },
  pick: el => {
    const g = el.parentElement; for (const b of g.children) b.setAttribute('aria-pressed', String(b === el));
    if (g.dataset.g === 'sec') $('#focBox').innerHTML = focChips(el.dataset.v, '');
  },
  tog: el => el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')),
  gSetup: shGist, syncNow: () => sync(true),
  gOff: () => confirmSheet('Отключить синхронизацию?', 'Данные останутся здесь и в GitHub, но перестанут обновляться на этом устройстве.', 'Отключить', () => { G = {}; localStorage.removeItem('ielts-gist'); close(); render(); }),
  backup: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'ielts-planner', v: 2, saved: new Date().toISOString(), data: S })], { type: 'application/json' }));
    a.download = `ielts-backup-${today()}.json`; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  reset: () => confirmSheet('Удалить все данные?', 'План, отметки и источники удалятся на этом устройстве' + (gOn() ? ' и в синхронизации' : '') + '. Сначала можно сохранить резервную копию.', 'Удалить всё', () => {
    S = blank(); S.meta.u = Date.now(); save(); close(); location.hash = 'today'; render(); if (gOn()) sync(true); shOnboard();
  }),
};
document.addEventListener('click', e => {
  if (e.target.closest('#toast button')) { const t = $('#toast'); t.hidden = true; t._f?.(); return; }
  if (e.target.classList.contains('backdrop')) return close();
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  ACT[el.dataset.a]?.(el, e);
});
document.addEventListener('change', async e => {
  const c = e.target.dataset?.c;
  if (c === 'src') { $('#secBox').innerHTML = secChips(e.target.value, src(e.target.value)?.secs[0]); $('#focBox').innerHTML = focChips(pressed('sec')[0], ''); }
  if (c === 'restore') {
    const f = e.target.files?.[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.data?.meta || !j.data.days) throw 0;
      confirmSheet('Заменить данные копией?', `Копия от ${j.saved ? new Date(j.saved).toLocaleDateString('ru-RU') : '—'}. Текущие данные будут заменены.`, 'Заменить', () => {
        S = j.data; fix(); S.meta.u = Date.now(); for (const d of Object.values(S.days)) { d.u = Date.now(); for (const it of d.items) it.u = Date.now(); } commit(); close(); toast('Данные восстановлены'); });
    } catch (err2) { toast('Это не резервная копия трекера'); }
    e.target.value = '';
  }
});
document.addEventListener('input', e => { if (e.target.getAttribute?.('aria-invalid')) { e.target.removeAttribute('aria-invalid'); e.target.closest('.field')?.querySelector('.err')?.remove(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#layer').hidden) close(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t.id === h)) { tab = h; close(); render(); window.scrollTo(0, 0); } });
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); selWd = parseD(lastDay).getDay(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (today() !== lastDay) { lastDay = today(); render(); } sync(false); });
setInterval(() => { if (gOn() && !document.hidden) sync(false); }, 60000);
window.addEventListener('online', () => sync(true));

// iOS home-screen apps can shrink the viewport after the keyboard or a picker closes; force a re-measure.
(function iosFix() {
  if (!(navigator.standalone === true || matchMedia('(display-mode: standalone)').matches)) return;
  let peak = innerHeight;
  const recover = () => {
    const want = Math.max(peak, matchMedia('(orientation: portrait)').matches ? screen.height : screen.width);
    if (want - innerHeight <= 4) return;
    const app = $('.app'), y = scrollY; app.style.display = 'none'; void app.offsetHeight; app.style.display = ''; scrollTo(0, y);
  };
  const later = () => { setTimeout(recover, 150); setTimeout(recover, 600); };
  addEventListener('resize', () => { peak = Math.max(peak, innerHeight); later(); });
  document.addEventListener('focusout', later);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
  later();
})();

(async function boot() {
  const h = location.hash.slice(1); if (TABS.some(t => t.id === h)) tab = h;
  load(); render();
  if (gOn()) await Promise.race([sync(false), new Promise(r => setTimeout(r, 6000))]);
  if (!S.meta.on && $('#layer').hidden) shOnboard();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
}
</script>
