<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2340e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="IELTS">
<title>IELTS трекер</title>
<style>
/* VOICE: calm study companion that feels native on Apple devices; quiet greys, one ink colour.
   IDEA: an exam ticket stub over a ruled study log — the countdown on top, the checklist beneath.
   PICTURE: a full-bleed ballpoint-blue band with a huge countdown and today's ring, then the checklist itself.
   COLOUR+TYPE: ballpoint blue, white sheets, highlighter yellow for the next step, red-pen flags; SF system text, rounded figures.
   LAYOUT: iPhone — stacked, bottom tab bar, safe areas; Mac — sidebar + two columns up to 1180px. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f1ee,#0e0e11);--panel:light-dark(#ffffff,#1b1b1f);--panel2:light-dark(#f6f5f2,#25252a);
--ink:light-dark(#151518,#f2f2f4);--mute:light-dark(#66666e,#a1a1aa);--line:light-dark(#e3e1dc,#313137);
--blue:light-dark(#2340e0,#6f86ff);--hero:light-dark(#2340e0,#1a2a94);--seg:light-dark(#ffffff,#3a3a41);--bsoft:light-dark(#e8ecff,#1e2652);
--hl:#ffe14d;--hlink:#1d1800;--red:light-dark(#cf2a1e,#ff6a5f);--rsoft:light-dark(#fde9e7,#3a1b1a);
--green:light-dark(#168048,#3ccf7f);--gold:light-dark(#8a6400,#f0c04a);--gsoft:light-dark(#fff3cc,#3a3012);
--r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
html.modal body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
svg{flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 65%,transparent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- shell: iPhone tab bar / Mac sidebar ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:4px max(6px,var(--sal)) calc(4px + var(--sab)) max(6px,var(--sar));background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600;position:relative;border-radius:12px}
.nav a svg{width:25px;height:25px}
.nav a[aria-current=page]{color:var(--blue)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.brand,.navfoot{display:none}
.nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:inherit;-webkit-backdrop-filter:inherit;backdrop-filter:inherit}
html,body{background:var(--bg)}
@media(max-width:899px){html{background:var(--panel)}.nav{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
main{padding-bottom:calc(84px + var(--sab))}
.app{min-height:100vh;min-height:100dvh}
.pg{max-width:1180px;margin:0 auto;padding:0 max(16px,var(--sar)) 8px max(16px,var(--sal))}
.pg.narrow{max-width:760px}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column;gap:2px;padding:22px 12px;border-top:0;border-right:1px solid var(--line);background:var(--panel2);-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav::after{display:none}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:42px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink)}
  .nav a svg{width:21px;height:21px;color:var(--blue)}
  .nav a[aria-current=page]{background:var(--bsoft);color:var(--blue)}
  .nav a:hover:not([aria-current]){background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .badge{position:static;margin-left:auto}
  .brand{display:block;padding:0 12px 18px}.brand b{display:block;font-size:22px;letter-spacing:-.01em}.brand span{color:var(--mute);font-size:14px}
  .navfoot{display:block;margin-top:auto;padding:0 12px;font-size:13px;color:var(--mute)}
  main{padding-bottom:40px}
  .pg{padding:0 32px 8px}
}
.macapp .nav{padding-top:48px}
.macapp .hero{padding-top:calc(34px + 20px)!important}
.macapp .ptitle{padding-top:44px}
#syncState::before,.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--green)}
#syncState[data-m=saving]::before,#syncState[data-m=connecting]::before,.sync[data-m=saving]::before,.sync[data-m=connecting]::before{background:var(--gold)}
#syncState[data-m=offline]::before,#syncState[data-m=error]::before,#syncState[data-m=local]::before,.sync[data-m=offline]::before,.sync[data-m=error]::before,.sync[data-m=local]::before{background:var(--mute)}
.sync{font-size:13px;color:var(--mute);white-space:nowrap}

/* ---- hero ---- */
.hero{background:var(--hero);color:#fff;padding:calc(var(--sat) + 22px) max(20px,var(--sar)) 26px max(20px,var(--sal));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% 40%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.12),transparent);pointer-events:none}
.hero-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;position:relative;z-index:1}
@media(min-width:900px){.hero{padding:30px 32px 32px}}
.hmeta{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:rgba(255,255,255,.86)}
.hmeta .ibtn{color:#fff;margin:-10px 0}
.count{font-size:clamp(76px,22vw,128px);font-weight:700;line-height:.92;letter-spacing:-.04em;margin-top:6px}
.count.dim{opacity:.55}.count.sk{opacity:.35}
.cl{font-size:19px;font-weight:600;margin-top:4px}
.hbtns{margin-top:12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tchip{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.hring{display:grid;justify-items:center;gap:8px;text-align:center}
.ringbox{position:relative;width:132px;height:132px}
.ringbox svg{width:100%;height:100%}
.rb{fill:none;stroke:rgba(255,255,255,.22);stroke-width:11}
.rf{fill:none;stroke:var(--hl);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1}
.rc b{font-size:34px;font-weight:700}.rc small{font-size:18px;opacity:.7}.rc span{font-size:14px;opacity:.8;margin-top:4px}
.rcap{display:grid;font-size:14px;color:rgba(255,255,255,.85);line-height:1.35}.rcap b{color:#fff}
@media(max-width:520px){.hero-in{grid-template-columns:minmax(0,1fr) auto;gap:12px}.ringbox{width:104px;height:104px}.rc b{font-size:27px}.rcap{font-size:13px}}

/* ---- buttons, chips, pills ---- */
.btn{appearance:none;border:1px solid transparent;border-radius:12px;min-height:44px;padding:0 16px;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--panel2);color:var(--ink);white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.pri{background:light-dark(#2340e0,#3d58f0);color:#fff}
.btn.dark{background:#17171b;color:#fff}
.btn.white{background:#fff;color:#1a2fb0}
.btn.line{background:transparent;border-color:color-mix(in srgb,var(--ink) 22%,transparent);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--blue);padding:0 10px}
.btn.danger{color:var(--red)}.btn.danger-bg{background:var(--red);color:#fff}
.ibtn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;background:transparent;border:0;color:inherit;flex:none;text-decoration:none}
.ibtn svg{width:21px;height:21px}
.ibtn.sm{width:40px;height:40px}.ibtn.sm svg{width:18px;height:18px}
.ibtn:disabled{opacity:.25;cursor:default}
.ibtn.go{color:var(--blue)}
.lnk{background:none;border:0;padding:0 2px;min-height:40px;font-size:15px;font-weight:600;color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent)}
.tlink{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;min-height:40px;padding:0 14px;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip[aria-pressed=true]{background:light-dark(#2340e0,#3d58f0);border-color:transparent;color:#fff}
.chips.wd .chip{min-width:44px;padding:0 10px}
.chips.big .chip{min-height:44px}
.chips.filt{margin:4px 0 12px}
.chipx{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,currentColor 9%,transparent);border:0;color:inherit;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chipx svg{width:15px;height:15px}.chipx.red{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.blue{background:var(--bsoft);color:var(--blue)}.pill.red{background:var(--rsoft);color:var(--red)}.pill.gold{background:var(--gsoft);color:var(--gold)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;flex:none;vertical-align:1px}

/* ---- sections & cards ---- */
.tgrid{display:grid;gap:0 28px}
@media(min-width:1120px){.tgrid{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);align-items:start}.side{position:sticky;top:12px}}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.sec h2{font-size:21px;font-weight:750;margin:0;letter-spacing:-.01em}
.ptitle{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0;padding:calc(var(--sat) + 22px) 0 8px;line-height:1.1}
@media(min-width:900px){.ptitle{padding-top:34px;font-size:38px}}
.lead{color:var(--mute);margin:4px 0 14px;max-width:62ch}
.hint{color:var(--mute);font-size:14px;margin:6px 0 10px}
.fine{color:var(--mute);font-size:13px;margin:8px 0 0;font-weight:400}
.center{text-align:center}
.empty{color:var(--mute);background:var(--panel);border-radius:var(--r);padding:16px;margin:0;font-size:15px}
.card{background:var(--panel);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.calm b{font-size:17px}.card .acts{margin-top:12px}
.ch{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:2px}
.sh-body .ch{margin-top:20px}
.sub{color:var(--mute);font-size:14px}

/* ---- next step ---- */
.next{background:var(--hl);color:var(--hlink);border-radius:22px;padding:18px 18px 12px;margin-top:18px;box-shadow:0 10px 30px -18px rgba(120,90,0,.6)}
.next .why{font-size:14px;font-weight:700;margin:0;opacity:.75}
.nhead{display:flex;justify-content:space-between;gap:10px}
.nstep{font-size:13px;font-weight:700;opacity:.55;white-space:nowrap}
.next h3{font-size:clamp(22px,5.4vw,28px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.015em;text-wrap:balance}
.nmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.nmeta .chipx.src{cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.acts.end{justify-content:flex-end;margin-top:20px}
.acts.wrap .btn{flex:0 1 auto}
.acts2{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.next .btn.line{color:var(--hlink);border-color:rgba(0,0,0,.28)}
.next .btn.white{color:var(--hlink)}
.timer{display:flex;align-items:center;gap:12px;margin:8px 0 0;flex-wrap:wrap}
.timer b{font-size:30px;font-weight:700}.timer .tl{font-size:14px;font-weight:650;opacity:.7}
.next.calm,.next.fin,.next.setup{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.next.calm .btn.line,.next.fin .btn.line{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.next.setup{border:2px solid var(--blue)}
.next .sub{color:var(--mute);margin:0}
.next.fin{display:flex;gap:16px;align-items:flex-start}
.finic{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}.finic svg{width:30px;height:30px}
.fintx h3{margin-top:2px}
.banner{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 10px 10px 12px;margin:12px 0 0}
.bic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bsoft);color:var(--blue);flex:none}.bic svg{width:19px;height:19px}
.banner.red .bic{background:var(--rsoft);color:var(--red)}
.bt{flex:1;display:grid;line-height:1.3}.bt b{font-size:15px}.bt span{font-size:13px;color:var(--mute)}

/* ---- lists & rows ---- */
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:11px;padding:2px;gap:2px}
.seg button{border:0;background:none;font-size:14px;font-weight:650;min-height:36px;padding:0 14px;border-radius:9px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--seg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.wide{display:flex;margin:6px 0 16px}.seg.wide button{flex:1;min-height:40px}
.list{background:var(--panel);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.list+.list{margin-top:12px}
.grp{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-weight:750;font-size:15px}
.grp:not(:first-child){border-top:6px solid var(--bg)}
.grp .cnt{margin-left:auto;color:var(--mute);font-weight:650;font-size:14px}
.okb{font-size:12.5px;font-weight:700;color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);padding:1px 7px;border-radius:99px}
.row{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 4px;min-height:58px;border-top:1px solid var(--line)}
.grp+.row{border-top:0}
.check{width:44px;height:44px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0}
.check i{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mute) 65%,transparent);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check i svg{width:16px;height:16px;stroke-width:3}
.row.done .check i{background:var(--green);border-color:var(--green);color:#fff}
.check i.sk{border-style:dashed;color:var(--mute)}.check i.sk svg{width:12px;height:12px}
.row.prog .check i{border-color:var(--blue)}
.gap{width:12px;flex:none}
.row .body{flex:1;display:grid;gap:2px;padding:8px 6px;text-align:left;background:none;border:0;min-height:44px;align-content:center}
.row .t{font-weight:600;line-height:1.28}
.row.done .t{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mute) 60%,transparent);color:var(--mute)}
.row.skipped .t{color:var(--mute)}
.row.virt{opacity:.72}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;color:var(--mute);font-size:13.5px;line-height:1.35}
.meta>span{display:inline-flex;align-items:center;white-space:nowrap}
.meta .run{color:var(--blue);font-weight:700}
.rord{display:flex;align-items:center;gap:0;flex:none}
.rord .btn{margin-right:4px}
.addrow{margin:6px 0 0}
.why2{font-size:13px;color:var(--mute);padding:0 16px 12px 54px;margin-top:-8px}

/* ---- today side ---- */
.sk{padding:8px 0;border-top:1px solid var(--line)}.sk:first-of-type{border-top:0;padding-top:0}
.skl{display:flex;align-items:center;gap:2px}.skl .nm{font-weight:650;flex:1}.skl b{font-size:15px}
.np{font-size:13px;color:var(--mute)}
.mini{height:6px;border-radius:3px;background:var(--panel2);margin:6px 0 4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c);border-radius:3px}
.skc{font-size:13px;color:var(--mute)}
.srow{display:flex;align-items:center;gap:8px;min-height:38px;border-top:1px solid var(--line);font-size:15px}.srow:first-of-type{border-top:0}
.srow .nm{flex:1;display:flex;align-items:center}.srow .warn{color:var(--red)}
.tgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tgrid2 div{display:grid}.tgrid2 b{font-size:22px}.tgrid2 span{font-size:13px;color:var(--mute)}

/* ---- plan ---- */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.dcard{flex:0 0 auto;width:148px;scroll-snap-align:start;background:var(--panel);border:0;border-radius:var(--r);padding:12px 14px;text-align:left;display:grid;gap:2px;align-content:start;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dcard .dw{font-size:13px;color:var(--mute);font-weight:650;text-transform:capitalize}
.dcard b{font-size:18px}.dcard .dn{font-size:14px}.dcard .dm{font-size:13px;color:var(--mute)}
.dcard .pill{justify-self:start;margin-top:4px}
.dcard.off{background:transparent;border:1px dashed var(--line);box-shadow:none}

/* ---- review ---- */
.fgrid{display:grid;gap:12px}
@media(min-width:900px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.fcard{background:var(--panel);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fct{display:flex;flex-wrap:wrap;gap:6px}
.fcard h3{font-size:18px;margin:8px 0 4px;line-height:1.25}
.fnote{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---- progress ---- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.calhead h2{font-size:21px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdh{text-align:center;font-size:13px;color:var(--mute);font-weight:650;padding-bottom:4px}
.cal .d{border:0;background:none;border-radius:12px;display:grid;justify-items:center;gap:2px;padding:4px 0;min-height:56px}
.cal .d:hover{background:var(--panel2)}
.ring{--c:var(--blue);width:36px;height:36px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center}
.ring b{width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:14px;font-weight:650}
.cal .closed .ring{--c:var(--green)}
.cal .missed .ring{background:repeating-conic-gradient(var(--line) 0 10deg,transparent 10deg 20deg)}
.cal .fut .ring,.cal .none .ring{background:transparent}.cal .fut .ring b{color:var(--mute);background:transparent}
.cal .tod .ring b{background:var(--blue);color:#fff}
.sd{display:flex;gap:2px;height:6px}.sd i{width:6px;height:6px;border-radius:50%;background:var(--c)}

<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="layer" id="layer" hidden><div class="backdrop"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
{
'use strict';
// ================= utils =================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MON = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WD_LONG = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const fmtDate = s => { if (!s) return ''; const d = parseD(s); return `${d.getDate()} ${MON_G[d.getMonth()]}`; };
const fmtDateY = s => { if (!s) return ''; const d = parseD(s); return `${d.getDate()} ${MON_G[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateW = s => `${WD[parseD(s).getDay()]}, ${fmtDate(s)}`;
const plural = (n, a, b, c) => { n = Math.abs(n); const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? a : t >= 2 && t <= 4 && (h < 10 || h >= 20) ? b : c; };
const fmtMin = m => { m = Math.round(m || 0); if (m < 60) return m + ' мин'; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} ч ${r} мин` : `${h} ч`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const safeUrl = u => {
  u = String(u || '').trim(); if (!u) return '';
  if (/^http:\/\//i.test(u)) u = 'https://' + u.slice(7);
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return /^https:\/\/[^\s<>"']+$/i.test(u) ? u : '';
};
const opts = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`).join('');
const clone = o => JSON.parse(JSON.stringify(o));

// ================= model =================
const SKILLS0 = [
  { id: 'L', name: 'Listening', color: '#1f7aff', core: true, on: true },
  { id: 'R', name: 'Reading', color: '#0fa3a3', core: true, on: true },
  { id: 'W', name: 'Writing', color: '#ee8400', core: true, on: true },
  { id: 'S', name: 'Speaking', color: '#a64de0', core: true, on: true },
  { id: 'G', name: 'Grammar', color: '#e33a62', core: false, on: true },
  { id: 'V', name: 'Vocabulary', color: '#a07a45', core: false, on: true },
  { id: 'P', name: 'Практика', color: '#5b5bd6', core: false, on: true },
];
const EXTRA_COLORS = ['#2e9e6a', '#c7522a', '#3f7cac', '#b0418f', '#7d8b2a'];
const REASONS = [['nu', 'Не понял'], ['rep', 'Хочу повторить'], ['unf', 'Не закончил'], ['imp', 'Важное'], ['own', 'Своя заметка']];
const REASON = Object.fromEntries(REASONS);
const STATUS = { queue: 'В очереди', planned: 'На сегодня', progress: 'В процессе', done: 'Выполнено', skipped: 'Пропущено' };

function defaultMeta() {
  return {
    v: 1, u: 0,
    settings: {
      onboarded: false, examName: 'IELTS Academic', examDate: '', target: '7.0', targets: { L: '', R: '', W: '', S: '' },
      weekStart: 1, boundary: 4, timer: true, groupBy: 'source', offDays: [],
      rem: { start: { on: true, time: '09:00' }, left: { on: true, time: '20:00', offWhenDone: true }, review: { on: true }, mock: { on: true }, check: { on: true, list: [60, 30, 14, 7, 3, 1] }, days: [0, 1, 2, 3, 4, 5, 6] },
      mac: { tray: false, notify: false }
    },
    skills: clone(SKILLS0), sources: [], template: []
  };
}
function fillDefaults(dst, src) {
  for (const k in src) {
    if (dst[k] === undefined) dst[k] = clone(src[k]);
    else if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object') fillDefaults(dst[k], src[k]);
  }
}
let S = { meta: defaultMeta(), tasks: {}, results: {}, days: {} };
function normalize() {
  inval();
  if (!S.meta) S.meta = defaultMeta();
  fillDefaults(S.meta, defaultMeta());
  S.tasks ||= {}; S.results ||= {}; S.days ||= {}; S.tomb ||= {};
  for (const t of Object.values(S.tasks)) { t.tags ||= []; t.movedFrom ||= []; }
}

// The starter structure from the user's diagram: four sources, ~1 hour each per day.
function starterStructure() {
  const sources = [
    { id: 'eng', name: 'Engnovate', url: 'https://engnovate.com', note: 'Все 4 секции', order: 1, minutes: 60,
      subs: [{ id: 'eL', name: 'Listening', skill: 'L', url: '' }, { id: 'eR', name: 'Reading', skill: 'R', url: '' }, { id: 'eW', name: 'Writing', skill: 'W', url: '' }, { id: 'eS', name: 'Speaking', skill: 'S', url: '' }] },
    { id: 'yt', name: 'YouTube', url: 'https://www.youtube.com', note: '', order: 2, minutes: 60,
      subs: [{ id: 'yA', name: 'IELTS Advantage', skill: 'W', url: 'https://www.youtube.com/@ieltsadvantage/videos' }, { id: 'yP', name: 'English Pro Tips', skill: 'S', url: 'https://www.youtube.com/@englishprotips/videos' }] },
    { id: 'bc', name: 'British Council', url: 'https://learnenglish.britishcouncil.org/grammar', note: '', order: 3, minutes: 60,
      subs: [{ id: 'bG', name: 'Grammar', skill: 'G', url: 'https://learnenglish.britishcouncil.org/grammar' }] },
    { id: 'pg', name: 'prep.gg', url: 'https://prep.gg', note: '', order: 4, minutes: 60,
      subs: [{ id: 'pP', name: 'Practice and games', skill: 'P', url: '' }] },
  ];
  const A = [1, 3, 5, 0], B = [2, 4, 6], ALL = [0, 1, 2, 3, 4, 5, 6];
  const template = [
    { id: 'tL', sourceId: 'eng', subId: 'eL', title: 'Пройти Listening-тест', skill: 'L', minutes: 30, days: A },
    { id: 'tR', sourceId: 'eng', subId: 'eR', title: 'Пройти следующий Reading-тест', skill: 'R', minutes: 30, days: A },
    { id: 'tW', sourceId: 'eng', subId: 'eW', title: 'Написать Writing Task', skill: 'W', minutes: 30, days: B },
    { id: 'tS', sourceId: 'eng', subId: 'eS', title: 'Практика Speaking', skill: 'S', minutes: 30, days: B },
    { id: 'tA', sourceId: 'yt', subId: 'yA', title: 'Разобрать видео IELTS Advantage', skill: 'W', minutes: 60, days: A },
    { id: 'tP', sourceId: 'yt', subId: 'yP', title: 'Разобрать видео English Pro Tips', skill: 'S', minutes: 60, days: B },
    { id: 'tG', sourceId: 'bc', subId: 'bG', title: 'Grammar — выбранная тема', skill: 'G', minutes: 60, days: ALL },
    { id: 'tX', sourceId: 'pg', subId: 'pP', title: 'Выполнить запланированную практику', skill: 'P', minutes: 60, days: ALL },
  ].map((t, i) => ({ tags: [], url: '', kind: '', on: true, order: i + 1, ...t }));
  return { sources, template };
}

// ---- lookups
const srcById = id => S.meta.sources.find(s => s.id === id);
const skillById = id => S.meta.skills.find(k => k.id === id);
const skillsOn = () => S.meta.skills.filter(k => k.on !== false);
const activeSources = () => S.meta.sources.filter(s => !s.archived).sort((a, b) => a.order - b.order);
const srcOrder = id => srcById(id)?.order ?? 999;
const subById = (srcId, subId) => srcById(srcId)?.subs?.find(x => x.id === subId);
const liveTasks = () => Object.values(S.tasks).filter(t => !t.removed);
const isOpen = t => t.status === 'planned' || t.status === 'progress';
const isDone = t => t.status === 'done';
const byOrder = (a, b) => (a.order - b.order) || (a.created - b.created);
let IDX = null;
const inval = () => { IDX = null; };
function dayIndex() {
  if (IDX) return IDX;
  IDX = {};
  for (const t of Object.values(S.tasks)) if (!t.removed && t.date) (IDX[t.date] ||= []).push(t);
  for (const k in IDX) IDX[k].sort(byOrder);
  return IDX;
}
const dayTasks = D => (dayIndex()[D] || []).slice();
const queueTasks = () => liveTasks().filter(t => !t.date && t.status === 'queue').sort(byOrder);
const flaggedTasks = () => liveTasks().filter(t => t.flag).sort((a, b) => (a.flag.date || '9999').localeCompare(b.flag.date || '9999') || b.flag.at - a.flag.at);
const taskUrl = t => safeUrl(t.url) || safeUrl(subById(t.sourceId, t.subId)?.url) || safeUrl(srcById(t.sourceId)?.url);
const srcName = id => srcById(id)?.name || 'Без источника';
const skillName = id => skillById(id)?.name || 'Без навыка';
const skillColor = id => skillById(id)?.color || '#8e8e93';
const elapsedMin = t => (t.actualMin || 0) + (t.timerStart ? Math.max(0, Date.now() - t.timerStart) / 60000 : 0);
const runningTask = () => liveTasks().find(t => t.timerStart);
const weekOrder = () => S.meta.settings.weekStart === 0 ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 0];

function today() { const b = +S.meta.settings.boundary || 0; return ymd(new Date(Date.now() - b * 3600e3)); }
function weekStartOf(D) { const ws = S.meta.settings.weekStart; const wd = parseD(D).getDay(); return addDays(D, -((wd - ws + 7) % 7)); }

function mkTask(o) {
  return Object.assign({ id: rid(), title: '', sourceId: '', subId: '', skill: '', tags: [], url: '', status: 'queue', date: '', plannedMin: 0, actualMin: 0,
    note: '', result: '', order: 0, flag: null, tplId: '', kind: '', repeatOf: '', extra: false, removed: false, movedFrom: [], doneAt: 0, timerStart: 0, created: Date.now(), u: 0 }, o);
}
function nextOrder(D) { const l = D ? dayTasks(D) : queueTasks(); return (l.reduce((m, t) => Math.max(m, t.order || 0), 0)) + 10; }

// ================= persistence + sync =================
const LS_KEY = 'ielts-tracker-v1';
const dirty = new Set(), inflight = new Set();
let col = null, syncMode = 'connecting', isReady = false, firstRemote = false, saveT = 0, cacheT = 0;

function keyGet(key) {
  if (key === 'meta') return S.meta;
  const p = key.slice(0, 2), id = key.slice(2);
  return p === 't_' ? S.tasks[id] : p === 'r_' ? S.results[id] : p === 'd_' ? S.days[id] : undefined;
}
function keyPut(key, v) {
  inval();
  if (key === 'meta') { S.meta = v; return; }
  const p = key.slice(0, 2), id = key.slice(2);
  if (p === 't_') S.tasks[id] = v; else if (p === 'r_') S.results[id] = v; else if (p === 'd_') S.days[id] = v;
}
function keyDel(key) {

function groupTasks(list, by) {
  const m = new Map();

  return keys.map(k => {
    const items = m.get(k), done = items.filter(isDone).length;
    return { key: k, name: by === 'skill' ? skillName(k) : srcName(k), dot: by === 'skill' ? dotHtml(k) : '', items, done, total: items.length, closed: items.length > 0 && done === items.length };
  });
}
function todayList(T, ds) {

function taskRow(t, o = {}) {
  const by = o.by || 'none', id = esc(t.id), url = taskUrl(t), done = isDone(t);
  const m = [];
  if (by !== 'skill') m.push(`<span>${dotHtml(t.skill)}${esc(skillName(t.skill))}</span>`);

function todayProgress(T, ds) {

function vPlan() {
  const T = today();
  if (!S.meta.settings.onboarded) return `<div class="pg"><h1 class="ptitle">План</h1>${setupCard()}</div>`;
  const n = nextInfo(T), ds = dayStats(T);
  const rest = dayTasks(T).filter(t => isOpen(t) && (!n || t.id !== n.t.id));
  const now = n ? `<div class="list">${taskRow(n.t, { tail: t => `<button class="ibtn" data-act="replace" data-id="${esc(t.id)}" aria-label="Заменить задачу">${IC.swap}</button>` })}<div class="why2">${esc(n.why)}</div></div>`
    : `<div class="card calm"><b>${ds.all.length ? 'План на сегодня завершён' : 'На сегодня задач нет'}</b><p class="sub">Можно взять задачу из очереди или посмотреть план на завтра.</p><div class="acts"><button class="btn line" data-act="pickExtra">Взять из очереди</button><button class="btn line" data-act="day" data-date="${addDays(T, 1)}">План на завтра</button></div></div>`;
  const then = rest.length ? `<div class="list">${rest.map((t, i) => taskRow(t, { tail: tt => reorderBtns(tt, i, rest.length, 'today') })).join('')}</div>` : `<p class="empty">После текущей задачи на сегодня ничего не осталось.</p>`;
  return `<div class="pg"><h1 class="ptitle">План</h1>
    <div class="sec"><h2>Сейчас</h2></div>${now}

function reorderBtns(t, i, n, scope) {
  const id = esc(t.id);

}
function planDays(T) {
  const cards = [];
  for (let i = 1; i <= 7; i++) {
    const D = addDays(T, i), list = previewDay(D), mins = list.reduce((s, t) => s + (+t.plannedMin || 0), 0);
    const off = !list.length;
    cards.push(`<button class="dcard${off ? ' off' : ''}" data-act="day" data-date="${D}"><span class="dw">${i === 1 ? 'Завтра' : WD_LONG[parseD(D).getDay()]}</span><b>${fmtDate(D)}</b><span class="dn">${off ? 'Выходной' : `${list.length} ${plural(list.length, 'задача', 'задачи', 'задач')}`}</span>${mins ? `<span class="dm num">${fmtMin(mins)}</span>` : ''}${list.some(t => t.kind === 'mock') ? '<span class="pill gold">Пробник</span>' : ''}${list.some(t => t.kind === 'review') ? '<span class="pill red">Повтор</span>' : ''}</button>`);
  }
  return `<div class="sec"><h2>Ближайшие дни</h2></div><div class="hscroll" tabindex="0" aria-label="Ближайшие 7 дней">${cards.join('')}</div>`;
}
function planQueue() {
  const q = queueTasks();
  return `<div class="sec"><h2>Общая очередь</h2><button class="btn ghost sm" data-act="addTask" data-date="">${IC.plus} В очередь</button></div>
  ${q.length ? `<div class="list">${q.map((t, i) => taskRow(t, { nocheck: true, tail: tt => `<span class="rord"><button class="btn sm line" data-act="toToday" data-id="${esc(tt.id)}">На сегодня</button>${reorderBtns(tt, i, q.length, 'queue')}</span>` })).join('')}</div>`
    : `<p class="empty">Очередь пуста. Сюда попадают задачи без даты: их можно взять после закрытия дневного плана.</p>`}`;
}
function planTemplate() {
  const st = S.meta.settings, srcs = activeSources();
  const off = weekOrder().map(d => `<button class="chip" data-act="offDay" data-v="${d}" aria-pressed="${st.offDays.includes(d)}">${WD[d]}</button>`).join('');
  const groups = srcs.map(s => {
    const items = S.meta.template.filter(t => t.sourceId === s.id).sort((a, b) => a.order - b.order);
    return `<div class="grp">${esc(s.name)}${s.paused ? '<span class="pill">на паузе</span>' : ''}<span class="cnt">${items.length ? fmtMin(avgPerDay(items)) + ' / день' : ''}</span></div>
      ${items.map((t, i) => `<div class="row${t.on === false ? ' virt' : ''}"><span class="gap"></span><button class="body" data-act="tpl" data-id="${esc(t.id)}"><span class="t">${esc(t.title)}</span><span class="meta"><span>${dotHtml(t.skill)}${esc(skillName(t.skill))}</span><span class="num">${fmtMin(t.minutes)}</span><span>${esc(daysSummary(t.days))}</span>${t.kind === 'mock' ? '<span class="pill gold">Пробник</span>' : ''}${t.on === false ? '<span class="pill">выключено</span>' : ''}</span></button><span class="rord"><button class="ibtn sm" data-act="tplMv" data-dir="-1" data-id="${esc(t.id)}" aria-label="Выше"${i === 0 ? ' disabled' : ''}>${IC.up}</button><button class="ibtn sm" data-act="tplMv" data-dir="1" data-id="${esc(t.id)}" aria-label="Ниже"${i === items.length - 1 ? ' disabled' : ''}>${IC.down}</button></span></div>`).join('')}
      ${items.length ? '' : '<div class="row virt"><span class="gap"></span><div class="body"><span class="meta">Нет регулярных занятий</span></div></div>'}`;
  }).join('');
  return `<div class="sec" id="schedule"><h2>Расписание</h2><button class="btn ghost sm" data-act="tpl" data-id="">${IC.plus} Занятие</button></div>

    <div class="card"><h3 class="ch">Выходные дни</h3><div class="chips wd">${off}</div><p class="fine">В выбранные дни обязательного плана нет.</p></div>

function avgPerDay(items) { return items.filter(t => t.on !== false).reduce((s, t) => s + (+t.minutes || 0) * (t.days || []).length, 0) / 7; }

function vReview() {
  const all = flaggedTasks(), T = today();
  const list = reviewFilter === 'all' ? all : all.filter(t => t.flag.reason === reviewFilter);
  const chips = [['all', 'Все'], ...REASONS].map(([k, l]) => { const c = k === 'all' ? all.length : all.filter(t => t.flag.reason === k).length; return `<button class="chip" data-act="rf" data-v="${k}" aria-pressed="${reviewFilter === k}">${l}${c ? ` <span class="num">${c}</span>` : ''}</button>`; }).join('');

    const f = t.flag, id = esc(t.id), url = taskUrl(t);
    const due = f.date ? (f.date < T ? `<span class="pill red">Просрочено · ${esc(relDay(f.date))}</span>` : `<span class="pill blue">Разбор ${esc(relDay(f.date))}</span>`) : '<span class="pill">Без даты</span>';
    return `<article class="fcard"><div class="fct"><span class="pill red">${IC.flag}${esc(REASON[f.reason] || 'Флажок')}</span>${due}</div>

      <div class="acts wrap">${url ? `<a class="btn sm line" href="${esc(url)}" target="_blank" rel="noopener">${IC.ext} Открыть</a>` : ''}<button class="btn sm line" data-act="revToday" data-id="${id}">В план на сегодня</button><button class="btn sm line" data-act="revDate" data-id="${id}">${IC.cal} Дата</button><button class="btn sm line" data-act="revTask" data-id="${id}">Создать повторение</button><button class="btn sm ghost" data-act="unflag" data-id="${id}">Снять флажок</button></div></article>`;

}

function vProgress() {
  const seg = [['cal', 'Календарь'], ['stats', 'Статистика'], ['res', 'Результаты']].map(([k, l]) => `<button data-act="pseg" data-v="${k}" aria-pressed="${progSeg === k}">${l}</button>`).join('');
  const body = progSeg === 'stats' ? vStats() : progSeg === 'res' ? vResults() : vCalendar();
  return `<div class="pg"><h1 class="ptitle">Прогресс</h1><div class="seg wide" role="group" aria-label="Раздел">${seg}</div>${body}</div>`;
}
function vCalendar() {
  const T = today(); if (!calMonth) calMonth = T.slice(0, 7);
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), nd = new Date(y, m, 0).getDate();
  const lead = (first.getDay() - S.meta.settings.weekStart + 7) % 7;
  let cells = weekOrder().map(d => `<span class="wdh">${WD[d]}</span>`).join('') + '<span></span>'.repeat(lead);
  let act = 0, full = 0, tasksDone = 0, minutes = 0;
  for (let i = 1; i <= nd; i++) {
    const D = `${y}-${pad(m)}-${pad(i)}`;
    let cls = 'd', p = 0, dots = '', lab = `${i} ${MON_G[m - 1]}`;
    if (D > T) {
      const n = previewDay(D).length; cls += ' fut'; lab += n ? `, запланировано ${n}` : ', выходной';
    } else {
      const st = dayStats(D);
      if (st.total || st.all.length) {
        p = st.total ? Math.round(st.pct * 100) : (st.any ? 100 : 0);
        if (st.closed) cls += ' closed';
        if (st.missed) cls += ' missed';
        const sk = [...new Set(st.all.filter(isDone).map(t => t.skill))].slice(0, 4);
        dots = sk.map(s => `<i style="--c:${skillColor(s)}"></i>`).join('');
        lab += st.missed ? ', план был, занятий нет' : `, выполнено ${st.done} из ${st.total}`;
      } else { cls += ' none'; lab += ', записей нет'; }
      if (st.any) act++; if (st.closed) full++;
      tasksDone += st.all.filter(isDone).length; minutes += st.minutes;
    }
    if (D === T) cls += ' tod';
    cells += `<button class="${cls}" style="--p:${p}" data-act="day" data-date="${D}" aria-label="${esc(lab)}"><span class="ring"><b class="num">${i}</b></span><span class="sd">${dots}</span></button>`;
  }
  const prev = ymd(new Date(y, m - 2, 1)).slice(0, 7), next = ymd(new Date(y, m, 1)).slice(0, 7);
  return `<div class="calhead"><button class="ibtn" data-act="cal" data-v="${prev}" aria-label="Предыдущий месяц">${IC.back}</button><h2>${MON[m - 1]} ${y}</h2><button class="ibtn" data-act="cal" data-v="${next}" aria-label="Следующий месяц">${IC.fwd}</button></div>
    <div class="card"><div class="cal">${cells}</div>
    <div class="legend"><span><i class="lg full"></i>План закрыт</span><span><i class="lg part"></i>Частично</span><span><i class="lg miss"></i>Не занимался</span><span><i class="lg dots"></i>Навыки дня</span></div></div>
    <div class="kpis three"><div class="kpi"><b class="num">${act}</b><span>${plural(act, 'день', 'дня', 'дней')} с занятиями</span></div><div class="kpi"><b class="num">${full}</b><span>полностью закрыто</span></div><div class="kpi"><b class="num">${tasksDone}</b><span>${plural(tasksDone, 'задача', 'задачи', 'задач')}${S.meta.settings.timer && minutes >= 1 ? ' · ' + fmtMin(minutes) : ''}</span></div></div>
    <p class="hint">Нажми на день, чтобы увидеть детали, добавить забытое занятие или исправить отметку.</p>`;
}
function barRows(entries, total, fmt) {
  if (!entries.length) return '<p class="empty">Пока нет выполненных задач за период.</p>';
  const max = Math.max(...entries.map(e => e.v), 1);
  return entries.map(e => `<div class="bar"><span class="bl">${e.dot || ''}${esc(e.name)}</span><span class="tr"><i style="width:${(e.v / max * 100).toFixed(1)}%;--c:${e.c || 'var(--blue)'}"></i></span><b class="num">${fmt(e)}</b></div>`).join('');
}

const RES_SK = () => [['O', 'Общий балл', '#2340e0'], ...S.meta.skills.filter(k => k.core).map(k => [k.id, k.name, k.color]), ...S.meta.skills.filter(k => !k.core && k.on !== false).map(k => [k.id, k.name, k.color])];
const resScore = r => r.scale === 'band' ? (+r.score).toFixed(1) : r.scale === 'raw' ? `${r.score}/${r.max || '?'}` : r.scale === 'pct' ? `${r.score}%` : esc(String(r.score));
function vResults() {
  const st = S.meta.settings, all = Object.values(S.results).sort((a, b) => b.date.localeCompare(a.date));

      if (same.length >= 2) { series = same; mode = 'raw'; }
    }
    const latest = rs[0];
    const fig = series.length >= 2 ? `<div class="fig sm" data-fig="${esc(JSON.stringify({ mode, color, target: mode === 'band' ? +target || 0 : 0, max: mode === 'raw' ? +series[0].max : 9, pts: series.map(r => [r.date, +r.score]) }))}" role="img" aria-label="Динамика: ${esc(name)}"></div>` : '';

}

function remSummary() {

// ================= charts =================
function drawFigs() {
  for (const el of $$('[data-fig]')) {
    if (el._ro) continue;
    const draw = () => {
      let d; try { d = JSON.parse(el.dataset.fig); } catch (e) { return; }
      const W = el.clientWidth, H = el.clientHeight; if (!W || !H) return;
      const padL = 30, padR = 12, padT = 12, padB = 22;
      const vals = d.pts.map(p => p[1]);
      let lo, hi;
      if (d.mode === 'band') { lo = Math.max(0, Math.floor(Math.min(...vals, d.target || 9) - 0.5)); hi = Math.min(9, Math.ceil(Math.max(...vals, d.target || 0) + 0.5)); if (hi - lo < 2) { lo = Math.max(0, hi - 2); } }
      else { lo = 0; hi = d.max || Math.max(...vals); }
      const x = i => padL + (d.pts.length === 1 ? 0 : i * (W - padL - padR) / (d.pts.length - 1));
      const y = v => padT + (1 - (v - lo) / (hi - lo || 1)) * (H - padT - padB);
      const grid = []; const step = d.mode === 'band' ? 1 : Math.max(1, Math.round((hi - lo) / 4));
      for (let v = lo; v <= hi + 1e-9; v += step) grid.push(`<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" class="gt">${d.mode === 'band' ? v.toFixed(0) : v}</text>`);
      const tl = d.target ? `<line x1="${padL}" x2="${W - padR}" y1="${y(d.target)}" y2="${y(d.target)}" class="tgt"/><text x="${W - padR}" y="${y(d.target) - 5}" text-anchor="end" class="gt tg">цель ${d.target}</text>` : '';
      const path = d.pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
      const dots = d.pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="4" fill="${d.color}"/>`).join('');
      const first = d.pts[0][0], lastD = d.pts[d.pts.length - 1][0];
      const lab = W > 260 ? `<text x="${padL}" y="${H - 4}" class="gt">${fmtDate(first)}</text><text x="${W - padR}" y="${H - 4}" text-anchor="end" class="gt">${fmtDate(lastD)}</text>` : '';
      el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid.join('')}${tl}<path d="${path}" fill="none" stroke="${d.color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg>`;
    };

let stack = [], sheetCtx = {}, lastFocus = null;

function paint() {

}

  return { title, body: `${o.lead ? `<p class="lead">${o.lead}</p>` : ''}<div class="chips big">${q.map(([v, l]) => `<button class="chip" data-act="ctx" data-fn="pick" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}${o.queue ? '<button class="chip" data-act="ctx" data-fn="pick" data-v="">В общую очередь</button>' : ''}</div>
    <label class="field"><span>Другая дата</span><input type="date" name="d" value="${esc(cur || '')}"></label>
    <div class="acts end"><button class="btn pri" data-act="ctx" data-fn="apply">Выбрать дату</button></div>`,
  ctx: {
    pick: el => onPick(el.dataset.v),
    apply: () => { const v = val($('#sheet'), 'd'); if (!v) { fieldErr($('#sheet'), 'd', 'Выбери дату'); return; } onPick(v); },
  } };
}
function sheetMove(id) {
  const t = S.tasks[id]; if (!t) return null;
  return sheetDate('Перенести', t.date, v => { moveTask(t, v); commit(); back(); toast(v ? `Перенесено на ${relDay(v)}` : 'Возвращено в очередь'); }, { queue: true, lead: esc(t.title) });
}
function sheetReplace(id) {
  const t = S.tasks[id]; if (!t) return null;
  const T = today(), others = dayTasks(T).filter(x => isOpen(x) && x.id !== id), q = queueTasks();
  const li = (x, fn) => `<button class="it" data-act="ctx" data-fn="${fn}" data-v="${esc(x.id)}"><span class="itx"><b>${esc(x.title)}</b><span class="sub">${esc(srcName(x.sourceId))} · ${esc(skillName(x.skill))}${x.plannedMin ? ' · ' + fmtMin(x.plannedMin) : ''}</span></span></button>`;
  return { title: 'Заменить задачу', body: `<p class="lead">Сейчас: ${esc(t.title)}</p>
    <h3 class="ch">Сначала другую из сегодняшнего плана</h3>${others.length ? `<div class="group">${others.map(x => li(x, 'first')).join('')}</div>` : '<p class="empty">В плане больше нет открытых задач.</p>'}
    <h3 class="ch">Заменить задачей из очереди</h3>${q.length ? `<div class="group">${q.map(x => li(x, 'queue')).join('')}</div><p class="fine">Текущая задача вернётся в общую очередь.</p>` : '<p class="empty">Очередь пуста.</p>'}`,
  ctx: {
    first: el => { const x = S.tasks[el.dataset.v]; if (t.timerStart) pauseTimer(t); if (t.status === 'progress') t.status = 'planned'; x.order = Math.min(t.order, ...dayTasks(T).filter(isOpen).map(z => z.order)) - 1; touchT(x); touchT(t); commit(); hideLayer(); toast('Порядок изменён'); },
    queue: el => { const x = S.tasks[el.dataset.v]; const ord = t.order; moveTask(t, ''); moveTask(x, T); x.order = ord; touchT(x); commit(); hideLayer(); toast('Задача заменена'); },
  } };
}
function sheetPickExtra() {
  const T = today(), q = queueTasks(), ds = dayStats(T);
  return { title: ds.open ? 'Взять из очереди' : 'Дополнительная задача', body: `<p class="lead">${ds.open ? 'Задача добавится в сегодняшний план.' : 'План закрыт — задача добавится как дополнительная и не изменит процент дня.'}</p>
    ${q.length ? `<div class="group">${q.map(x => `<button class="it" data-act="ctx" data-fn="take" data-v="${esc(x.id)}"><span class="itx"><b>${esc(x.title)}</b><span class="sub">${esc(srcName(x.sourceId))} · ${esc(skillName(x.skill))}${x.plannedMin ? ' · ' + fmtMin(x.plannedMin) : ''}</span></span><span class="pill blue">Взять</span></button>`).join('')}</div>` : '<p class="empty">Очередь пуста — создай новую задачу.</p>'}
    <div class="acts end"><button class="btn line" data-act="addTask" data-date="${T}">${IC.plus} Новая задача</button></div>`,
  ctx: { take: el => { const x = S.tasks[el.dataset.v]; const extra = dayStats(T).open === 0 && dayStats(T).total > 0; moveTask(x, T); x.extra = extra; touchT(x); commit(); hideLayer(); toast(extra ? 'Добавлено как дополнительная' : 'Добавлено в план'); } } };
}
function sheetUnfinished() {
  const T = today(), list = liveTasks().filter(t => t.date && t.date < T && isOpen(t)).sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order);
  if (!list.length) return null;
  return { title: 'Незавершённые задачи', body: `<p class="lead">Реши, что делать с каждой. Ничего не переносится само.</p>
    <div class="acts"><button class="btn sm line" data-act="ctx" data-fn="all" data-v="today">Все на сегодня</button><button class="btn sm line" data-act="ctx" data-fn="all" data-v="queue">Все в очередь</button><button class="btn sm line" data-act="ctx" data-fn="all" data-v="skip">Все пропустить</button></div>
    ${list.map(t => `<div class="ucard"><b>${esc(t.title)}</b><span class="sub">${esc(fmtDateW(t.date))} · ${esc(srcName(t.sourceId))} · ${esc(skillName(t.skill))}</span>
      <div class="acts wrap"><button class="btn sm pri" data-act="ctx" data-fn="one" data-v="today" data-id="${esc(t.id)}">На сегодня</button><button class="btn sm line" data-act="ctx" data-fn="date" data-id="${esc(t.id)}">Дата</button><button class="btn sm line" data-act="ctx" data-fn="one" data-v="queue" data-id="${esc(t.id)}">В очередь</button><button class="btn sm line" data-act="ctx" data-fn="one" data-v="skip" data-id="${esc(t.id)}">Пропустить</button></div></div>`).join('')}`,
  ctx: {
    one: el => { unfApply(S.tasks[el.dataset.id], el.dataset.v); commit(); refresh(); },
    all: el => { for (const t of list) unfApply(t, el.dataset.v); commit(); refresh(); },
    date: el => pushSheet(() => sheetMove(el.dataset.id)),
  } };
}
function unfApply(t, v) {
  if (!t) return;
  if (v === 'today') moveTask(t, today());
  else if (v === 'queue') moveTask(t, '');
  else { if (t.timerStart) pauseTimer(t); t.status = 'skipped'; touchT(t); }
}

// ================= day =================
function sheetDay(D) {
  const T = today(), st = S.meta.settings;
  const title = D === T ? 'Сегодня, ' + fmtDate(D) : fmtDateW(D) + (D.slice(0, 4) !== T.slice(0, 4) ? ' ' + D.slice(0, 4) : '');
  if (D > T) {
    const list = previewDay(D), gen = !!S.days[D]?.gen, wd = parseD(D).getDay();
    const offW = st.offDays.includes(wd), offD = !!S.days[D]?.off;
    return { title, body: `<p class="lead">${list.length ? `${list.length} ${plural(list.length, 'задача', 'задачи', 'задач')} · ${fmtMin(list.reduce((s, t) => s + (+t.plannedMin || 0), 0))}` : (offW || offD ? 'Выходной — без обязательного плана' : 'Ничего не запланировано')}</p>
      ${list.length ? `<div class="list">${list.map(t => t.virtual ? virtRow(t) : taskRow(t, { nocheck: true })).join('')}</div>` : ''}
      ${list.some(t => t.virtual) ? '<p class="fine">Задачи «по шаблону» и «по флажку» появятся в этот день автоматически. Если меняешь шаблон — они изменятся тоже.</p>' : ''}
      <div class="acts wrap"><button class="btn line" data-act="addTask" data-date="${D}">${IC.plus} Разовая задача</button>
      ${!offW ? `<button class="btn line" data-act="ctx" data-fn="off">${offD ? 'Отменить выходной' : 'Сделать выходным'}</button>` : ''}
      ${!gen && list.some(t => t.virtual) ? '<button class="btn line" data-act="ctx" data-fn="fix">Зафиксировать и редактировать</button>' : ''}</div>`,
    ctx: {
      off: () => { S.days[D] = { ...(S.days[D] || { date: D }), off: !offD }; touch('d_' + D); commit(); refresh(); },
      fix: () => { genDay(D); commit(); refresh(); toast('План дня зафиксирован — задачи можно менять'); },
    } };
  }
  const ds = dayStats(D);
  const moved = liveTasks().filter(t => t.date !== D && (t.movedFrom || []).some(m => m.from === D));
  const res = Object.values(S.results).filter(r => r.date === D);
  const summary = ds.missed ? `План был (${ds.total}), занятий не отмечено` : ds.total || ds.all.length ? `${ds.done} из ${ds.total}${ds.extraDone ? ` · +${ds.extraDone} доп.` : ''}${st.timer && ds.minutes >= 1 ? ' · ' + fmtMin(ds.minutes) : ''}${ds.closed ? ' · план закрыт полностью' : ''}` : 'Записей нет';
  return { title, body: `<p class="lead">${summary}</p>
    ${ds.all.length ? `<div class="list">${ds.all.map(t => taskRow(t, { by: 'none' })).join('')}</div>` : ''}
    ${moved.length ? `<h3 class="ch">Перенесено</h3><div class="list">${moved.map(t => `<div class="row virt"><span class="gap"></span><button class="body" data-act="task" data-id="${esc(t.id)}"><span class="t">${esc(t.title)}</span><span class="meta"><span>→ ${t.date ? esc(relDay(t.date)) : 'в очередь'}</span><span>${esc(STATUS[t.status])}</span></span></button></div>`).join('')}</div>` : ''}
    ${res.length ? `<h3 class="ch">Результаты</h3><div class="group">${res.map(r => `<button class="it" data-act="result" data-id="${esc(r.id)}"><span class="itx"><b>${esc(r.title || 'Результат')}</b><span class="sub">${esc(r.skill === 'O' ? 'Общий балл' : skillName(r.skill))}</span></span><b class="num">${resScore(r)}</b></button>`).join('')}</div>` : ''}
    <div class="acts wrap"><button class="btn line" data-act="addTask" data-date="${D}">${IC.plus} ${D < T ? 'Добавить забытое занятие' : 'Добавить задачу'}</button><button class="btn line" data-act="resultOn" data-date="${D}">${IC.star} Результат</button></div>
    ${D < T ? '<p class="fine">Нажми на задачу, чтобы исправить отметку, время или заметку. План этого дня хранится как был.</p>' : ''}` };
}

// ================= sources =================
function sheetSource(id) {
  const s = srcById(id); if (!s) return null;
  const T = today(), items = S.meta.template.filter(t => t.sourceId === id).sort((a, b) => a.order - b.order);
  const cur = dayTasks(T).filter(t => t.sourceId === id && isOpen(t));
  const upcoming = [];
  for (let i = 1; i <= 7 && upcoming.length < 5; i++) { const D = addDays(T, i); for (const t of previewDay(D)) if (t.sourceId === id && upcoming.length < 5) upcoming.push({ ...t, _d: D }); }
  const q = queueTasks().filter(t => t.sourceId === id);
  const hist = liveTasks().filter(t => t.sourceId === id && isDone(t)).sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.doneAt - a.doneAt);
  const mins = hist.reduce((m, t) => m + elapsedMin(t), 0);
  const skills = [...new Set([...(s.subs || []).map(x => x.skill), ...items.map(t => t.skill)])].filter(Boolean);
  const url = safeUrl(s.url);
  return { title: esc(s.name), body: `
    ${s.paused ? '<p class="banner"><span class="bic">' + IC.pause + '</span><span class="bt"><b>На паузе</b><span>Регулярные задачи не создаются</span></span></p>' : ''}
    <div class="acts">${url ? `<a class="btn dark" href="${esc(url)}" target="_blank" rel="noopener">${IC.ext} Открыть сайт</a>` : ''}<button class="btn line" data-act="srcEdit" data-id="${esc(id)}">${IC.edit} Изменить</button></div>
    ${s.note ? `<p class="fnote">${esc(s.note)}</p>` : ''}
    <div class="nmeta">${skills.map(skillChip).join('')}</div>
    ${(s.subs || []).length ? `<h3 class="ch">Направления</h3><div class="group">${s.subs.map(x => `<div class="it"><span class="itx"><b>${esc(x.name)}</b>${x.skill && skillName(x.skill) !== x.name ? `<span class="sub">${esc(skillName(x.skill))}</span>` : ''}</span>${safeUrl(x.url) ? `<a class="ibtn" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener" aria-label="Открыть ${esc(x.name)}">${IC.ext}</a>` : ''}</div>`).join('')}</div>` : ''}
    <h3 class="ch">Расписание ${s.minutes ? `<span class="fine">· планируемое время ${fmtMin(s.minutes)} в день</span>` : ''}</h3>
    ${items.length ? `<div class="group">${items.map(t => `<button class="it chev" data-act="tpl" data-id="${esc(t.id)}"><span class="itx"><b>${esc(t.title)}</b><span class="sub">${esc(daysSummary(t.days))} · ${fmtMin(t.minutes)}${t.on === false ? ' · выключено' : ''}</span></span></button>`).join('')}</div>` : '<p class="empty">Нет регулярных занятий.</p>'}
    <div class="acts"><button class="btn sm ghost" data-act="tplNew" data-src="${esc(id)}">${IC.plus} Регулярное занятие</button></div>
    <h3 class="ch">Текущая задача</h3>${cur.length ? `<div class="list">${cur.map(t => taskRow(t, { by: 'source' })).join('')}</div>` : '<p class="empty">Сегодня по этому источнику всё закрыто или ничего нет.</p>'}
    <h3 class="ch">Следующие</h3>${upcoming.length || q.length ? `<div class="list">${upcoming.map(t => t.virtual ? virtRow({ ...t, title: t.title + ' · ' + relDay(t._d) }) : taskRow(t, { nocheck: true, date: true, by: 'source' })).join('')}${q.map(t => taskRow(t, { nocheck: true, status: true, by: 'source' })).join('')}</div>` : '<p class="empty">Ничего не запланировано.</p>'}
    <h3 class="ch">История <span class="fine">· ${hist.length} ${plural(hist.length, 'занятие', 'занятия', 'занятий')}${S.meta.settings.timer && mins >= 1 ? ' · ' + fmtMin(mins) : ''}</span></h3>
    ${hist.length ? `<div class="list">${hist.slice(0, 15).map(t => taskRow(t, { date: true, by: 'source' })).join('')}</div>` : '<p class="empty">Пока ничего не выполнено.</p>'}
    <div class="acts wrap"><button class="btn line" data-act="ctx" data-fn="pause">${s.paused ? 'Снять с паузы' : 'Поставить на паузу'}</button><button class="btn line danger" data-act="ctx" data-fn="arch">Архивировать</button></div>
    <p class="fine">Архив скрывает источник, но сохраняет всю историю.</p>`,
  ctx: {
    pause: () => { s.paused = !s.paused; touchMeta(); commit(); refresh(); },
    arch: () => { s.archived = true; touchMeta(); commit(); back(); toast(`${s.name} в архиве`, [{ label: 'Отменить', fn: () => { s.archived = false; touchMeta(); commit(); } }]); },
  } };
}
function subRowHtml(x) {
  return `<div class="subrow" data-sub="${esc(x.id || rid())}"><input name="subName" value="${esc(x.name || '')}" placeholder="Название, напр. IELTS Advantage" aria-label="Название направления"><select name="subSkill" aria-label="Навык направления">${skillOpts(x.skill, 'Навык')}</select><input name="subUrl" value="${esc(x.url || '')}" type="url" inputmode="url" placeholder="Ссылка — необязательно" aria-label="Ссылка направления"><button type="button" class="ibtn sm" data-act="subDel" aria-label="Удалить направление">${IC.x}</button></div>`;
}
function sheetSrcEdit(id) {
  const s = id ? srcById(id) : { id: '', name: '', url: '', note: '', subs: [], minutes: '' };
  if (!s) return null;
  return { title: id ? 'Изменить источник' : 'Новый источник', body: `
    <label class="field"><span>Название</span><input name="name" value="${esc(s.name)}" maxlength="60" placeholder="Например: Cambridge IELTS"></label>
    <label class="field"><span>Ссылка на сайт или канал</span><input name="url" type="url" inputmode="url" value="${esc(s.url)}" placeholder="https://…"></label>
    <div class="two"><label class="field"><span>Планируемое время в день, мин</span><input name="minutes" type="number" inputmode="numeric" min="0" max="600" step="5" value="${s.minutes || ''}"></label><span></span></div>
    <label class="field"><span>Заметка</span><input name="note" value="${esc(s.note || '')}" maxlength="140"></label>
    <h3 class="ch">Направления внутри источника</h3><p class="fine">Например, каналы на YouTube или разделы сайта. Направление и навык — разные вещи: видео IELTS Advantage может быть и про Writing, и про Speaking.</p>
    <div id="subs">${(s.subs || []).map(subRowHtml).join('')}</div>
    <button type="button" class="btn ghost sm" data-act="subAdd">${IC.plus} Направление</button>
    <div class="acts end"><button class="btn pri" data-act="ctx" data-fn="save">${id ? 'Сохранить' : 'Добавить'}</button></div>`,
  ctx: { save: () => {
    const sh = $('#sheet'), name = val(sh, 'name'), url = val(sh, 'url');
    if (!name) { fieldErr(sh, 'name', 'Добавь название'); return; }
    if (url && !safeUrl(url)) { fieldErr(sh, 'url', 'Нужна ссылка вида https://…'); return; }
    const subs = $$('.subrow', sh).map(r => ({ id: r.dataset.sub, name: r.querySelector('[name="subName"]').value.trim(), skill: r.querySelector('[name="subSkill"]').value, url: safeUrl(r.querySelector('[name="subUrl"]').value) })).filter(x => x.name);
    if (id) Object.assign(s, { name, url: safeUrl(url), note: val(sh, 'note'), minutes: +val(sh, 'minutes') || 0, subs });
    else S.meta.sources.push({ id: 's' + rid(), name, url: safeUrl(url), note: val(sh, 'note'), minutes: +val(sh, 'minutes') || 0, subs, order: Math.max(0, ...S.meta.sources.map(x => x.order || 0)) + 1, paused: false, archived: false });
    touchMeta(); commit(); back(); toast(id ? 'Источник сохранён' : 'Источник добавлен');
  } } };
}
function sheetArchive() {
  const a = S.meta.sources.filter(s => s.archived);
  if (!a.length) return null;
  return { title: 'Архив источников', body: `<div class="group">${a.map(s => `<div class="it"><span class="itx"><b>${esc(s.name)}</b><span class="sub">${liveTasks().filter(t => t.sourceId === s.id && isDone(t)).length} выполненных задач в истории</span></span><button class="btn sm line" data-act="ctx" data-fn="restore" data-v="${esc(s.id)}">Восстановить</button></div>`).join('')}</div>`,
    ctx: { restore: el => { const s = srcById(el.dataset.v); s.archived = false; s.order = Math.max(0, ...activeSources().map(x => x.order)) + 1; touchMeta(); commit(); refresh(); } } };
}

// ================= template =================
function sheetTpl(id, srcId) {
  const T = today();
  const t = id ? S.meta.template.find(x => x.id === id) : { id: '', sourceId: srcId || activeSources()[0]?.id || '', subId: '', title: '', skill: '', tags: [], minutes: 60, days: [0, 1, 2, 3, 4, 5, 6], url: '', kind: '', on: true };
  if (!t) return null;
  const inst = id && S.tasks[T + '_' + id];
  return { title: id ? 'Регулярное занятие' : 'Новое регулярное занятие', body: `
    ${taskForm({ ...t, plannedMin: t.minutes }, { date: false })}
    <div class="field"><span>Дни недели</span>${daysChips(t.days)}</div>
    <div class="field"><span>Тип</span>${radioChips('kind', [['', 'Обычное'], ['mock', 'Пробник']], t.kind || '')}</div>
    <label class="field ck"><input type="checkbox" name="on"${t.on !== false ? ' checked' : ''}><span>Включено в расписание</span></label>
    ${inst && isOpen(inst) ? '<label class="field ck"><input type="checkbox" name="today"><span>Обновить и сегодняшнюю задачу</span></label>' : ''}
    <p class="fine">Изменения действуют на будущие дни. История и уже прошедшие планы не меняются.</p>
    <div class="acts end">${id ? '<button class="btn line danger" data-act="ctx" data-fn="del">Удалить из расписания</button>' : ''}<button class="btn pri" data-act="ctx" data-fn="save">${id ? 'Сохранить' : 'Добавить'}</button></div>`,
  ctx: {
    del: () => {
      pushSheet(() => sheetConfirm('Удалить занятие из расписания?', 'Будущие дни больше не будут его содержать. Уже созданные задачи и история останутся.', 'Удалить', () => {
        S.meta.template = S.meta.template.filter(x => x.id !== id); touchMeta(); commit(); hideLayer(); toast('Удалено из расписания');
      }));
    },
    save: () => {
      const sh = $('#sheet'), o = readTaskForm(sh); if (!o) return;
      const days = multi(sh, 'days').map(Number);
      if (!days.length) { toast('Выбери хотя бы один день недели'); return; }
      const rec = { title: o.title, sourceId: o.sourceId, subId: o.subId, skill: o.skill, tags: o.tags, url: o.url, minutes: o.plannedMin || 0, days, kind: radio(sh, 'kind'), on: !!sh.querySelector('[name="on"]')?.checked };
      if (id) Object.assign(t, rec);
      else S.meta.template.push({ id: 'p' + rid(), order: Math.max(0, ...S.meta.template.filter(x => x.sourceId === o.sourceId).map(x => x.order || 0)) + 1, ...rec });
      touchMeta();
      if (inst && sh.querySelector('[name="today"]')?.checked) { Object.assign(inst, { title: rec.title, sourceId: rec.sourceId, subId: rec.subId, skill: rec.skill, tags: rec.tags, url: rec.url, plannedMin: rec.minutes, kind: rec.kind }); touchT(inst); }
      commit(); back(); toast(id ? 'Расписание обновлено' : 'Добавлено в расписание');
    },
  } };
}

// ================= skills, reminders, results, misc =================
function sheetSkills() {
  return { title: 'Навыки и категории', body: `<p class="lead">Основные навыки IELTS нельзя выключить. Остальные категории можно скрыть или добавить свои.</p>

    <div class="two addsk"><label class="field"><span>Новая категория</span><input name="newSk" maxlength="30" placeholder="Например: Pronunciation"></label><button class="btn line" data-act="ctx" data-fn="add">Добавить</button></div>
    <div class="acts end"><button class="btn pri" data-act="ctx" data-fn="save">Сохранить</button></div>`,
  ctx: {
    tog: el => { el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); },
    add: () => {
      const sh = $('#sheet'), n = val(sh, 'newSk'); if (!n) { fieldErr(sh, 'newSk', 'Введи название'); return; }
      readSkills(sh);
      const used = S.meta.skills.map(k => k.color);
      S.meta.skills.push({ id: 'k' + rid().slice(0, 5), name: n, color: EXTRA_COLORS.find(c => !used.includes(c)) || '#7a7a85', core: false, on: true });
      touchMeta(); commit(); refresh();
    },
    save: () => { readSkills($('#sheet')); touchMeta(); commit(); back(); toast('Сохранено'); },

function readSkills(sh) {
  for (const k of S.meta.skills) {
    const inp = sh.querySelector(`[name="sk_${k.id}"]`); if (inp && !k.core && inp.value.trim()) k.name = inp.value.trim();
    const s = sh.querySelector(`.switch[data-v="${k.id}"]`); if (s && !k.core) k.on = s.getAttribute('aria-checked') === 'true';
  }
}

function sheetResult(id, date) {
  const r = id ? S.results[id] : { id: '', date: date || today(), title: '', sourceId: '', skill: 'O', scale: 'band', score: '', max: 40, url: '', note: '' };
  if (!r) return null;
  return { title: id ? 'Результат' : 'Новый результат', body: `
    <div class="two"><label class="field"><span>Дата</span><input type="date" name="date" value="${esc(r.date)}"></label><label class="field"><span>Навык</span><select name="skill">${opts(RES_SK().map(x => [x[0], x[1]]), r.skill)}</select></label></div>
    <label class="field"><span>Название пробника или задания</span><input name="title" value="${esc(r.title)}" maxlength="100" placeholder="Например: Cambridge 18, Test 2"></label>
    <label class="field"><span>Источник</span><select name="sourceId">${opts([['', '—'], ...S.meta.sources.map(s => [s.id, s.name])], r.sourceId)}</select></label>
    <div class="field"><span>Шкала</span>${radioChips('scale', [['band', 'Band 0–9'], ['raw', 'Правильные ответы'], ['pct', 'Проценты'], ['other', 'Другое']], r.scale)}</div>
    <div class="two"><label class="field"><span>Результат</span><input name="score" value="${esc(r.score)}" inputmode="decimal" placeholder="6.5"></label><label class="field" data-show="raw"><span>Из скольких</span><input name="max" type="number" inputmode="numeric" value="${esc(r.max || '')}"></label></div>
    <label class="field"><span>Ссылка на результат — необязательно</span><input name="url" type="url" inputmode="url" value="${esc(r.url || '')}"></label>
    <label class="field"><span>Заметка</span><textarea name="note" rows="2">${esc(r.note || '')}</textarea></label>
    ${r.url && safeUrl(r.url) ? `<p><a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Открыть результат ${IC.ext}</a></p>` : ''}
    <div class="acts end">${id ? '<button class="btn line danger" data-act="ctx" data-fn="del">Удалить</button>' : ''}<button class="btn pri" data-act="ctx" data-fn="save">Сохранить</button></div>`,
  ctx: {
    del: () => { delete S.results[id]; dirty.add('r_' + id); commit(); back(); toast('Результат удалён'); },
    save: () => {
      const sh = $('#sheet'), scale = radio(sh, 'scale') || 'band';
      let score = val(sh, 'score').replace(',', '.');
      if (!score) { fieldErr(sh, 'score', 'Введи результат'); return; }
      if (scale !== 'other') {
        const n = +score;
        if (!isFinite(n)) { fieldErr(sh, 'score', 'Нужно число'); return; }
        if (scale === 'band' && (n < 0 || n > 9)) { fieldErr(sh, 'score', 'Band от 0 до 9'); return; }
        score = n;
      }
      const url = val(sh, 'url'); if (url && !safeUrl(url)) { fieldErr(sh, 'url', 'Нужна ссылка вида https://…'); return; }
      const rec = { date: val(sh, 'date') || today(), title: val(sh, 'title'), sourceId: val(sh, 'sourceId'), skill: val(sh, 'skill'), scale, score, max: scale === 'raw' ? (+val(sh, 'max') || 0) : 0, url: safeUrl(url), note: val(sh, 'note') };
      const rid2 = id || rid();
      S.results[rid2] = { ...(S.results[rid2] || {}), id: rid2, ...rec }; touch('r_' + rid2);
      commit(); back(); toast('Результат сохранён');
    },
  },
  mount: sh => { const upd = () => { const sc = radio(sh, 'scale'); sh.querySelector('[data-show="raw"]').style.visibility = sc === 'raw' ? 'visible' : 'hidden'; }; upd(); sh.addEventListener('click', e => { if (e.target.closest('[data-radio="scale"]')) setTimeout(upd); }); } };
}
function sheetConfirm(title, text, okLabel, onOk) {
  return { title: esc(title), body: `<p class="lead">${esc(text)}</p><div class="acts end"><button class="btn line" data-act="back">Отмена</button><button class="btn pri danger-bg" data-act="ctx" data-fn="ok">${esc(okLabel)}</button></div>`, ctx: { ok: onOk } };
}

// ================= data export / restore =================
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
let DL = null;
async function saveFile(name, data) {
  if (DL) {
    try { await DL.save({ filename: name, data }); toast('Файл сохранён'); return; }
    catch (e) { const c = e && e.code; if (c === 'declined') return; if (c === 'rate_limited') { toast('Подожди пару секунд и попробуй снова'); return; } }
  }
  pushSheet(() => ({ title: 'Скопируй данные', body: `<p class="lead">Скачивание здесь недоступно — скопируй текст и сохрани в файл «${esc(name)}».</p><textarea class="mono" readonly rows="10">${esc(data)}</textarea><div class="acts end"><button class="btn pri" data-act="ctx" data-fn="copy">Скопировать</button></div>`,
    ctx: { copy: async () => { try { await navigator.clipboard.writeText(data); toast('Скопировано'); } catch (e) { toast('Не удалось — выдели текст вручную'); } } } }));
}
function exportCsv() {
  const rows = [['Дата', 'Статус', 'Задача', 'Источник', 'Направление', 'Навык', 'Теги', 'План, мин', 'Факт, мин', 'Тип', 'Флажок', 'Заметка к флажку', 'Дата разбора', 'Заметка', 'Результат', 'Перенесено с']];
  liveTasks().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || a.order - b.order).forEach(t => rows.push([
    t.date || '', t.status === 'planned' && t.date < today() ? 'Не выполнено' : STATUS[t.status], t.title, srcName(t.sourceId), subById(t.sourceId, t.subId)?.name || '', skillName(t.skill),
    (t.tags || []).map(skillName).join('; '), t.plannedMin || '', Math.round(elapsedMin(t)) || '', t.kind === 'review' ? 'Повтор' : t.kind === 'mock' ? 'Пробник' : t.extra ? 'Дополнительная' : '',
    t.flag ? REASON[t.flag.reason] : '', t.flag?.note || '', t.flag?.date || '', t.note || '', t.result || '', (t.movedFrom || []).map(m => m.from).join(' ')]));
  saveFile(`ielts-history-${today()}.csv`, toCsv(rows));
}
function exportRes() {
  const rows = [['Дата', 'Название', 'Источник', 'Навык', 'Шкала', 'Результат', 'Из', 'Ссылка', 'Заметка']];
  Object.values(S.results).sort((a, b) => a.date.localeCompare(b.date)).forEach(r => rows.push([r.date, r.title, srcName(r.sourceId), r.skill === 'O' ? 'Общий балл' : skillName(r.skill), { band: 'Band', raw: 'Правильные ответы', pct: 'Проценты', other: 'Другое' }[r.scale], r.score, r.max || '', r.url || '', r.note || '']));
  saveFile(`ielts-results-${today()}.csv`, toCsv(rows));
}
function backupJson() { saveFile(`ielts-backup-${today()}.json`, JSON.stringify({ app: 'ielts-tracker', v: 1, exported: new Date().toISOString(), data: S })); }
function sheetRestore() {
  return { title: 'Восстановить из копии', body: `<p class="lead">Выбери файл резервной копии (.json) или вставь его текст. Текущие данные будут заменены — на всех устройствах.</p>
    <label class="field"><span>Файл</span><input type="file" name="file" accept=".json,application/json"></label>
    <label class="field"><span>Или текст копии</span><textarea name="txt" rows="5" class="mono" placeholder='{"app":"ielts-tracker",…}'></textarea></label>
    <div class="acts end"><button class="btn pri" data-act="ctx" data-fn="go">Восстановить</button></div>`,
  ctx: { go: async () => {
    const sh = $('#sheet'), f = sh.querySelector('[name="file"]').files?.[0];
    let txt = val(sh, 'txt');
    if (f) { try { txt = await f.text(); } catch (e) { fieldErr(sh, 'file', 'Не удалось прочитать файл'); return; } }
    let j; try { j = JSON.parse(txt); } catch (e) { fieldErr(sh, 'txt', 'Это не похоже на резервную копию'); return; }
    const d = j && j.data; if (!d || !d.meta || typeof d.tasks !== 'object') { fieldErr(sh, 'txt', 'В файле нет данных трекера'); return; }
    pushSheet(() => sheetConfirm('Заменить все данные?', `Копия от ${j.exported ? new Date(j.exported).toLocaleString('ru-RU') : 'неизвестной даты'}: ${Object.keys(d.tasks).length} задач, ${Object.keys(d.results || {}).length} результатов.`, 'Заменить', () => {
      const old = allKeys(); S = { meta: d.meta, tasks: d.tasks || {}, results: d.results || {}, days: d.days || {} }; normalize();
      const now = new Set(allKeys()); for (const k of old) if (!now.has(k)) dirty.add(k);
      for (const k of now) touch(k);
      runDaily(); hideLayer(); commit(); toast('Данные восстановлены');
    }));
  } } };
}
function resetAll() {
  pushSheet(() => sheetConfirm('Удалить все данные?', 'Задачи, история, источники, расписание и результаты будут удалены на всех устройствах. Сначала можно сделать резервную копию.', 'Удалить всё', () => {
    const old = allKeys(); S = { meta: defaultMeta(), tasks: {}, results: {}, days: {} }; normalize();
    for (const k of old) dirty.add(k); touchMeta();
    hideLayer(); go('today'); commit(); toast('Все данные удалены');
  }));
}

// ================= actions =================
function go(t) { if (location.hash.slice(1) !== t) location.hash = t; else { tab = t; render(); window.scrollTo(0, 0); } }
const TT = id => S.tasks[id];
function after(el) { if (el && el.closest && el.closest('#sheet')) { if (el.dataset.back) back(); else refresh(); } }
function doDone(id, on, el) {
  const t = TT(id); if (!t) return;
  const prev = { status: t.status, doneAt: t.doneAt, date: t.date, order: t.order, actualMin: t.actualMin, timerStart: t.timerStart };
  setDone(t, on); commit(); after(el);
  if (!on) return;
  const acts = [{ label: 'Отменить', fn: () => { Object.assign(t, prev); touchT(t); commit(); refresh(); } }];
  if (S.meta.settings.timer && elapsedMin(t) < 1) acts.unshift({ label: 'Время', fn: () => pushSheet(() => sheetTime(id)) });
  const ds = dayStats(today());
  toast(t.date === today() && ds.open === 0 && ds.total ? 'План на сегодня завершён!' : 'Выполнено', acts);
}
function reorderTask(id, dir, scope) {
  const t = TT(id); if (!t) return;
  const list = scope === 'queue' ? queueTasks() : dayTasks(today()).filter(isOpen);
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const o = list[j]; let a = t.order, b = o.order; if (a === b) b = a + dir;
  t.order = b; o.order = a; touchT(t); touchT(o); commit();
}
function reorderTpl(id, dir) {
  const t = S.meta.template.find(x => x.id === id); if (!t) return;
  const list = S.meta.template.filter(x => x.sourceId === t.sourceId).sort((a, b) => a.order - b.order);
  const i = list.indexOf(t), j = i + dir; if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]]; list.forEach((x, k) => { x.order = k + 1; });
  touchMeta(); commit();
}
function reorderSrc(id, dir) {
  const list = activeSources(), i = list.findIndex(s => s.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]]; list.forEach((x, k) => { x.order = k + 1; });
  touchMeta(); commit();
}

  tog: el => el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')),
  radio: el => { for (const b of el.parentElement.children) b.setAttribute('aria-pressed', String(b === el)); },
  exam: () => pushSheet(sheetExam),
  onboard: () => pushSheet(sheetOnboard),
  unfinished: () => pushSheet(sheetUnfinished),
  gotoResults: () => { progSeg = 'res'; go('progress'); },
  addTask: el => { const d = el.dataset.date; pushSheet(() => sheetTaskForm(null, { date: d })); },
  pickExtra: () => pushSheet(sheetPickExtra),
  task: el => { const id = el.dataset.id; if (TT(id)) pushSheet(() => sheetTask(id)); },
  source: el => { const id = el.dataset.id; if (srcById(id)) pushSheet(() => sheetSource(id)); },
  done: el => doDone(el.dataset.id, true, el),

// ================= GitHub gist sync (standalone version) =================
const GIST_FILE = 'ielts-tracker-data.json', GIST_DESC = 'IELTS tracker data (private)';
let gistCfg = {}, gistLast = 0, gistT = 0, gistBusy = null;
try { gistCfg = JSON.parse(localStorage.getItem('ielts-gist') || '{}'); } catch (e) { gistCfg = {}; }
function gistOn() { return !!(gistCfg && gistCfg.token && gistCfg.id); }
async function gh(path, opt = {}) {

}
function rGet(R, key) {

  const p = key.slice(0, 2), id = key.slice(2);
  return p === 't_' ? R.tasks?.[id] : p === 'r_' ? R.results?.[id] : p === 'd_' ? R.days?.[id] : undefined;
}
function rKeys(R) { return ['meta', ...Object.keys(R.tasks || {}).map(i => 't_' + i), ...Object.keys(R.results || {}).map(i => 'r_' + i), ...Object.keys(R.days || {}).map(i => 'd_' + i)]; }
// Merge a remote snapshot into S, entity by entity (newest wins, deletions via tombstones). Returns [localChanged, needPush].

  for (const k of Object.keys(R.tomb || {})) if (!(S.tomb || {})[k]) ch = true;
  for (const k of Object.keys(S.tomb || {})) if (!(R.tomb || {})[k]) push = true;

    const lu = l ? (l.u || 0) : -1, ru = r ? (r.u || 0) : -1;
    if (key !== 'meta' && t && Math.max(lu, ru) <= t) { if (l) { keyDel(key); ch = true; } if (r) push = true; continue; }
    if (ru > lu) { keyPut(key, clone(r)); ch = true; }

    <div class="ucard"><b>1. Создай токен</b><span class="sub">Открой ссылку, войди в GitHub, срок действия — «No expiration», оставь только галочку <b>gist</b> и нажми «Generate token».</span>

// ================= iOS standalone viewport fix =================
// iOS home-screen apps shrink the viewport by ~59px after the keyboard or a picker closes,
// lifting the tab bar and leaving a dead band below it. Force WebKit to re-measure.
(function iosViewportFix() {
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (!standalone) return;
  let peak = window.innerHeight;
  const expected = () => Math.max(peak, window.matchMedia('(orientation: portrait)').matches ? screen.height : screen.width);
  function recover() {
    if (expected() - window.innerHeight <= 4) return;
    const app = $('.app'); if (!app) return;
    const y = window.scrollY;
    app.style.display = 'none'; void app.offsetHeight; app.style.display = '';
    const nav = $('#nav'); if (nav) { nav.style.display = 'none'; void nav.offsetHeight; nav.style.display = ''; }
    window.scrollTo(0, y);
  }
  const later = () => { setTimeout(recover, 150); setTimeout(recover, 600); };
  window.addEventListener('resize', () => { peak = Math.max(peak, window.innerHeight); later(); });
  document.addEventListener('focusout', later);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
  window.addEventListener('orientationchange', () => { peak = 0; later(); });
  document.addEventListener('click', e => { if (e.target.closest('[data-act="closeAll"],[data-act="back"],.backdrop,[data-act="ctx"]')) later(); }, true);
  later();
})();
